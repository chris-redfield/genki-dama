function groundPattern(){if(!GPAT&&GROUND.complete&&GROUND.naturalWidth){try{GPAT=ctx.createPattern(GROUND,'repeat');}catch(e){}}return GPAT;}
const TEX_PER_WORLD=512/2.4;
/* ---------- the floor ----------
   paintGround lays the sand down as ~200 horizontal strips, each one a pattern
   fill carrying its own setTransform, because a perspective floor is not an
   affine map and a pattern can only do affine. That is by far the most
   expensive thing the game draws, and on a phone it is also the most fragile:
   those per-strip transforms drop onto a software path, and the throw's camera
   zoom magnifies every one of them - the floor arrived untextured and the
   animation crawled.
   It is, however, completely static: it depends on the frame size, the device
   ratio and which grid is in play, and on nothing that moves. So it is painted
   once into an offscreen canvas and blitted from then on - one drawImage per
   frame instead of two hundred pattern fills. The blit obeys whatever transform
   the caller is under, so the throw camera still zooms it; it magnifies the
   cached pixels rather than re-rasterising the floor, which is the trade that
   buys the frame rate back. */
function paintGround(x,top){
  let pat=null;
  if(GROUND.complete&&GROUND.naturalWidth){try{pat=x.createPattern(GROUND,'repeat');}catch(e){}}
  const {R,h,D,hz,f}=floorP();
  if(!pat||!pat.setTransform){x.fillStyle=DUST;x.fillRect(0,top?0:hz,W,H);return;}
  if(top){
    const s=Math.min(W*.44,H*.36)/(G.R||1.6)/TEX_PER_WORLD;
    pat.setTransform(new DOMMatrix().translate(W/2,H*.57).scale(s,s));x.fillStyle=pat;x.fillRect(0,0,W,H);return;
  }
  // perspective ground drawn in horizontal strips, matching proj()
  for(let y=Math.floor(hz+1);y<H;y+=3){
    const yc=y+1.5,depth=f*h/(yc-hz),s=(f/depth)/TEX_PER_WORLD,z=depth-D-R;
    const dzdy=f*h/((yc-hz)*(yc-hz)),sv=1/(dzdy*TEX_PER_WORLD);
    pat.setTransform(new DOMMatrix().translate(W/2,yc).scale(s,-sv).translate(0,-z*TEX_PER_WORLD));
    x.fillStyle=pat;x.fillRect(0,y,W,3.5);
  }
  const g=x.createLinearGradient(0,hz,0,hz+H*.3);g.addColorStop(0,'rgba(232,176,102,1)');g.addColorStop(.35,'rgba(232,176,102,.55)');g.addColorStop(1,'rgba(232,176,102,0)');x.fillStyle=g;x.fillRect(0,hz,W,H*.3);
}
let GCV=null,GCKEY='';
function groundCache(top){
  const key=(top?'t':'p')+'|'+Math.round(W)+'x'+Math.round(H)+'|'+DPR+'|'+(G.R||1.6)+'|'+(GROUND.complete&&GROUND.naturalWidth?1:0);
  if(GCV&&GCKEY===key)return GCV;
  const c=GCV||(GCV=document.createElement('canvas'));
  const pw=Math.max(1,Math.round(W*DPR)),ph=Math.max(1,Math.round(H*DPR));
  const x=c.getContext('2d');
  if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph;}else x.clearRect(0,0,pw,ph);
  x.setTransform(DPR,0,0,DPR,0,0);
  paintGround(x,top);
  GCKEY=key;return c;
}
/* Building the sheet costs one paintGround, and the moment it would otherwise
   happen is the worst one available: the cut from the held orb into the grid,
   where the player is already waiting for a scene change, so the stall reads as
   a freeze. It is warmed while the menu is still up instead, where nothing is
   moving and a stall is invisible. The grid in play sets the floor's scale, so
   the warm-up asks the toggles which grid that will be, and they re-warm it
   when the answer changes. */
function warmGround(){
  if(!(GROUND.complete&&GROUND.naturalWidth))return;
  try{G.R=buildGrid(S.grid).R;groundCache(S.aim==='top');}catch(e){}
}
if(GROUND.complete&&GROUND.naturalWidth)setTimeout(warmGround,0);
else GROUND.addEventListener('load',()=>setTimeout(warmGround,0),{once:true});

/* Everything above the horizon stays transparent, so the backdrop keeps showing.
   Only the part of the sheet the camera can actually see is blitted: the throw
   zooms to 2.8x, where four fifths of the floor is off screen and copying it
   would cost the zoom squared. The source rect is in cache pixels, the
   destination in user units, so the result lands exactly where a full blit
   would have put it. */
function drawGround(top){
  const c=groundCache(top);
  let x0=0,y0=0,x1=W,y1=H;
  try{
    const inv=ctx.getTransform().inverse();
    const xs=[],ys=[];
    for(const [px,py] of [[0,0],[cv.width,0],[0,cv.height],[cv.width,cv.height]]){
      const q=inv.transformPoint(new DOMPoint(px,py));xs.push(q.x);ys.push(q.y);
    }
    x0=Math.max(0,Math.floor(Math.min(...xs)));x1=Math.min(W,Math.ceil(Math.max(...xs)));
    y0=Math.max(0,Math.floor(Math.min(...ys)));y1=Math.min(H,Math.ceil(Math.max(...ys)));
  }catch(e){x0=0;y0=0;x1=W;y1=H;}
  if(x1<=x0||y1<=y0)return;
  ctx.drawImage(c,x0*DPR,y0*DPR,(x1-x0)*DPR,(y1-y0)*DPR,x0,y0,x1-x0,y1-y0);
}
function aimScene(showUI){
  const top=S.aim==='top';
  if(top)drawGround(true);
  else{drawBG(BG1,floorP().hz,1);drawGround(false);}
  const cov=G.phase==='aim'?covered(G.reticle,G.level):(G.cov||[]);
  for(const c of G.cells){polyPath(c);ctx.fillStyle='rgba(255,236,200,.22)';ctx.fill();inkStroke(2);}
  for(const c of cov){polyPath(c);
    if(top){ctx.fillStyle='rgba(143,216,255,.55)';ctx.fill();}
    else{ctx.fillStyle=`rgba(70,35,15,${.42+.06*Math.sin(G.t*4)})`;ctx.fill();}}
  if(G.phase==='aim'||G.phase==='throw'){polyPath(G.reticle);ctx.lineWidth=6;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=3;ctx.strokeStyle=top?'#fff':SUN;ctx.stroke();}
  const ep=enemyAimPos();let lean=0,tilt=0,sy=1,dx=0,dy=0;
  const sway=Math.sin(G.t*2.3)*.04+Math.sin(G.t*3.7)*.025;
  if(G.phase==='aim'&&G.pt>=G.tellAt&&G.pt<=G.tellAt+G.tellDur){
    const q=Math.sin((G.pt-G.tellAt)/G.tellDur*Math.PI);
    if(G.plan===G.enemyCell){sy=1-.12*q;}
    else{const a=proj(G.enemyCell.x,G.enemyCell.z),b=proj(G.plan.x,G.plan.z);const vx=b.x-a.x,vy=b.y-a.y,l=Math.hypot(vx,vy)||1;
      dx=vx/l;dy=vy/l;lean=q;tilt=dx*.28*q;}
  }
  const es=ep.u*.95;
  ctx.fillStyle='rgba(70,35,15,.4)';ctx.beginPath();ctx.ellipse(ep.x,ep.y,es*.28,es*.08,0,0,TAU);ctx.fill();
  if(lean>.3){for(let i=0;i<4;i++){circ(ep.x-dx*es*(.2+i*.08),ep.y-dy*es*.1+(i%2)*3,es*.045*(1+i*.4));ctx.fillStyle='#f5e2c0';ctx.globalAlpha=lean;ctx.fill();inkStroke(1.5);ctx.globalAlpha=1;}}
  let pose=0;
  if(lean>.15)pose=dx>=0?1:2; else if(sy<.985)pose=3;
  if(pose&&enReady(pose)){tilt*=.3;sy=1;}
  enemyS(ctx,pose,ep.x+dx*es*.12*lean,ep.y-es*.62,es,{tilt:tilt+sway,sy});
  if(G.phase==='aim')drawSphere(W/2,-sphereAimR()*.25,sphereAimR(),G.t);

    const tw=Math.min(300,W*.5),ty=PORT?56:18;
    rr(W/2-tw/2,ty,tw,10,5);ctx.fillStyle='#fff8e6';ctx.fill();ctx.save();rr(W/2-tw/2,ty,tw,10,5);ctx.clip();ctx.fillStyle=KI;ctx.fillRect(W/2-tw/2,ty,tw*(1-G.pt/G.aimLimit),10);ctx.restore();rr(W/2-tw/2,ty,tw,10,5);inkStroke(2.5);
    comic('OLHE O CORPO DELE. ESCOLHA A CASA.',W/2,ty+36,Math.round(clamp(W*.035,16,24)),'#fff','center');
    if(PORT)comic('GENKI DAMA: '+LEVELNAME().toUpperCase(),W/2,ty+64,18,ORB_B,'center');
    else comic('GENKI DAMA: '+LEVELNAME().toUpperCase(),18,H-24-(W<560?96:0),20,ORB_B);
  }
}
function throwScene(){
  const follow=S.throwCam==='follow';

  const zoomEnd=follow?.85:.95;const p=clamp(G.pt/zoomEnd,0,1),e=ease(p);
  if(follow&&G.hit&&G.pt>.85){reverseShot((G.pt-.85)/.55);return;}
  ctx.save();
  if(follow){const k=1+1.8*e;const cx=lerp(W/2,tp.x,e),cy=lerp(H/2,tp.y,e);ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.translate(-cx,-cy);}
  aimScene(false);
  const r0=sphereAimR();
  let cr=0;for(const c of G.cov){const q=proj(c.x,c.z);cr=Math.max(cr,Math.hypot(q.x-tp.x,q.y-tp.y));}cr+=tp.u*.55;
  const x=lerp(W/2,tp.x,e),y=lerp(-r0*.25,tp.y-tp.u*.3*(1-e),e),r=lerp(r0,cr,e);

}
function reverseShot(q){
  q=clamp(q,0,1);

  const R=Math.max(W,H);
  [[1.1,ORB_B],[.85,ORB_L],[.6,'#fff']].forEach(([k,c])=>{ctx.fillStyle=c;circ(W/2,H/2,R*k*(.4+q*.6));ctx.fill();});
  focusLines(W/2,H/2,.9);

/* ---------- disintegration ---------- */
let DIS=null;
function buildDisint(){
  const c=document.createElement('canvas');c.width=200;c.height=260;const x=c.getContext('2d');
  if(enReady(5)){const im=ENS[5],hh=250,ww=im.naturalWidth*hh/im.naturalHeight;x.drawImage(im,100-ww/2,5,ww,hh);}
  else drawEnemy(x,100,135,210,{aura:false});

  const ps=[];const st=3;let maxd=0;
  for(let y=0;y<260;y+=st)for(let xx=0;xx<200;xx+=st){const k=(y*200+xx)*4;if(data[k+3]>60){const hx=xx-100,hy=y-130;const d=Math.hypot(hx,hy);maxd=Math.max(maxd,d);
    const q=v=>Math.round(v/32)*32;ps.push({hx,hy,d,col:`rgb(${q(data[k])},${q(data[k+1])},${q(data[k+2])})`});}}
  for(const p of ps){const n=p.d/maxd;p.th=(1-n)*.62+Math.random()*.3;const l=p.d||1;p.vx=p.hx/l*rand(8,40)+rand(-8,8);p.vy=-rand(25,80)+p.hy/l*rand(0,15);}

}
function lightBG(){
  const R=Math.max(W,H);ctx.fillStyle='#3a8ff0';ctx.fillRect(0,0,W,H);
  [[.75,ORB_B],[.5,ORB_L],[.3,'#fff']].forEach(([k,c])=>{ctx.fillStyle=c;circ(W/2,H/2,R*k*(1+.03*Math.sin(G.t*20)));ctx.fill();});
  ctx.save();ctx.translate(W/2,H/2);ctx.fillStyle='rgba(255,255,255,.3)';
  for(let i=0;i<14;i++){const a=i/14*TAU+G.t*.25;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,a,a+.08);ctx.closePath();ctx.fill();}
  ctx.restore();
}
function disintScene(){
  const full=S.disint==='full'&&DIS;const T=full?2.4:1.1;const p=G.pt/T;
  lightBG();
  const sc=Math.min(W,H)*.68/260,cx=W/2,cy=H/2;
  if(!full){
    enemyS(ctx,5,cx,cy,Math.min(W,H)*.55,{aura:false,alpha:clamp(1-p,0,1),tilt:Math.sin(G.t*30)*.02});
    ctx.fillStyle=`rgba(255,255,255,${clamp(1-G.pt*2,0,1)})`;ctx.fillRect(0,0,W,H);return;
  }

    if(p<q.th){const X=cx+q.hx*sc+tr,Y=cy+q.hy*sc;if(q.th-p<.06)glow.rect(X,Y,sz,sz);else{let pa=byCol.get(q.col);if(!pa){pa=new Path2D();byCol.set(q.col,pa);}pa.rect(X,Y,sz,sz);}}
    else{const age=(p-q.th)*T;if(age>1.1)continue;const X=cx+(q.hx+q.vx*age)*sc,Y=cy+(q.hy+q.vy*age-age*age*20)*sc;
      const b=Math.min(3,Math.floor(age/1.1*4));fly[b].rect(X,Y,sz*.8,sz*.8);}

/* ---------- draw dispatch ---------- */
function draw(){
  switch(G.phase){
    case 'menu': titleScene();break;
    case 'corridor': corridorScene();break;
    case 'fullShot': opening();break;
    case 'gather':
      if(G.cutaway>0)cutawayScene();
      else if(G.closeup>0)closeupScene();
      else{gatherScene(false);gatherHUD();}
      break;
    // the HUD clears for the held breath, but the urna has to stay: in portrait
    // it is the only thing that paints the dock strip under the scene
    case 'silence': gatherScene(true);if(PORT)drawUrna();break;
    case 'aim': aimScene(true);break;
    case 'throw': throwScene();break;
    case 'disint': disintScene();break;
    case 'orbitHit': orbitScene(false);break;
    case 'orbitMiss': orbitScene(true);break;
    case 'pushin': pushinScene();break;
    case 'missText': aimScene(false);comic('ERROU!',W/2,H*.48,Math.round(Math.min(W,H)*.2),'#fff','center',-.05);break;
    case 'result':
      if(G.resultKind==='defeat'){drawBG(BG1,H*.76,1.1);}
      else{drawBG(BG2,H*.44,1.05);if(G.resultKind==='miss')enemyS(ctx,0,W*.78,H*.42+Math.sin(G.t*1.2)*4,Math.min(W,H)*.26,{aura:false});}
      ctx.fillStyle='rgba(27,21,18,.15)';ctx.fillRect(0,0,W,H);break;
  }
}

// the custom-planet loader lived in the panel; the game uses assets/planet.jpg
try{localStorage.removeItem('worldorb-planet');}catch(e){}

newRun(true);G.phase='menu';$('menu').hidden=false;
updateTouch();
requestAnimationFrame(loop);
})();
</script>
