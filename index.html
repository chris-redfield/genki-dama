<meta charset="utf-8">
<!-- Without this a phone lays the page out at 980px and scales it down: every
     touch target shrinks and the canvas is drawn at a third of its real size.
     user-scalable=no is deliberate - pinch and double-tap zoom while mashing
     would fight the player. -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a88f9">
<meta name="mobile-web-app-capable" content="yes">
<title>Vô votar no 13!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titan+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Layout: one full-bleed canvas stage; HUD drawn in canvas; DOM overlays styled as manga panels (thick ink border, hard offset shadow). Single daylight look by design. */
:root{
  --ink:#1b1512; --paper:#fffaf0; --muted:#5e5048; --sky:#1a88f9; --sun:#ffd23a; --ki:#ff5a2a; --red:#e4002b; --orb:#8fd8ff; --dust:#e8b066;
  /* How tall the title character stands, as a multiple of the patch of sand he
     was originally framed for. The sheets draw him at three scales and we moved
     from the smallest to the middle one, so he is drawn at that figure's scale
     too: 607px tall against the smallest's 414. Set this to 1 to put him back
     at the size the layout was first built around. */
  --manScale:1.466;
  /* the CONFIRMA key's own green, sampled off assets/new/urna-*.webp - the how-to
     sentence points at that key by colour, so the two have to agree */
  --go:#0ae046;
  --display:"Titan One",Impact,"Arial Black",sans-serif;
  --body:"M PLUS Rounded 1c","Trebuchet MS",system-ui,sans-serif;
  color-scheme:light;
  /* 1 under the (max-height:520px) breakpoint at the bottom of this sheet; the
     secret refuses to open there because the panel would sit across the man */
  --tiny:0;
}
html,body{height:100%}
/* The phone browser chrome slides in and out as you play; 100dvh keeps the
   stage glued to what is actually on screen instead of to the tallest it
   could ever be. Desktop reads the same number either way. */
@supports(height:100dvh){html,body{height:100dvh}}
/* no pull-to-refresh, no text inflation, no grey flash under a mashing thumb */
html{overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:14px;overflow:hidden}
#stage{position:relative;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#cv{display:block;width:100%;height:100%}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(27,21,18,.28)}
.card{background:var(--paper);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:22px 24px;max-width:470px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:100%;overflow:auto}
#menu .card{overflow:visible;background:none;border:0;box-shadow:none;text-align:center}
/* the title is wider than the card on purpose, so give it its own full-width
   box to centre inside - centring inside the narrow card box just overflows right */
#menu .card h1{width:100vw;max-width:none;position:relative;left:50%;transform:translateX(-50%)}
/* +20% on 2026-10-15. The three terms are not interchangeable: the px and vh
   caps say how big the logo may get and both grew by a fifth, while the vw
   term is the guard that keeps it on screen. In portrait that guard is what
   binds - the logo already spans the width - so there a fifth does not exist
   to give; it goes to 98vw, as far as it can go without touching the edges. */
#titleLogo{display:block;width:min(98vw,898px,109vh);height:auto;margin:0 auto}
/* Menu exit: logo leaves left, everything else leaves right, staggered.
   The logo itself is animated rather than its h1, because that h1 already
   carries translateX(-50%) for centring and a second transform would fight it. */
#titleLogo,#menu .card>*:not(h1){transition:transform .5s cubic-bezier(.55,.06,.68,.19)}
#menu.leaving #titleLogo{transform:translateX(-150vw)}
#menu.leaving .card>*:not(h1):not(#titleFoot){transform:translateX(150vw)}
/* The idle bob is gone: he used to hang in the air for half a second with
   nothing to do, and it had started applying to the crouch, where a man braced
   on the sand should certainly not be bobbing. He now crouches, leaves the
   ground and launches in one move, so there is nothing left to idle through. */
#menu.flying{background:transparent}
/* The climb is an ANIMATION, not a transition, and it has to stay one. It used
   to swap out of a bob animation: Chrome takes the before-change value of a
   transition from the running animation, refuses to start it, and the transform
   snapped straight to -135vh - he vanished for the whole climb. Firefox started
   it, which is why it only broke in Chrome. The bob is gone now, but the moment
   anything animates this sprite again, a transition here breaks the same way. */
@keyframes titleFly{from{transform:translateY(0)}to{transform:translateY(-135vh)}}
#menu.flying #titleSpr{animation:titleFly var(--panMs,1625ms) cubic-bezier(.42,0,.72,.3) forwards;transition:none}
#menu .card>*:nth-child(3){transition-delay:.03s}
#menu .card>*:nth-child(4){transition-delay:.06s}
#menu .card>*:nth-child(5){transition-delay:.09s}
#menu .card>*:nth-child(6){transition-delay:.12s}
#menu .card>*:nth-child(7){transition-delay:.15s}
#menu .card>*:nth-child(8){transition-delay:.18s}
@media (prefers-reduced-motion:reduce){#titleLogo,#menu .card>*{transition-duration:.01s;transition-delay:0s}}
#menu .card{gap:10px;padding-top:164px;padding-bottom:14px}   /* the title block sits 150px lower */
/* Dust kicked up as he leaves the ground. It sits outside .card on purpose: the
   menu swipe moves .card's children and the climb moves #titleSpr, and the dust
   must do neither - it stays on the sand he jumped from while he goes up. No
   z-index, just DOM order: it comes before the sprite, so it paints behind him. */
#puff{position:absolute;left:50%;bottom:0;width:0;height:0;pointer-events:none}
#puff i{position:absolute;left:0;top:0;width:26px;height:26px;margin:-13px 0 0 -13px;
  border-radius:50%;opacity:0;
  background:radial-gradient(circle at 36% 34%,#fffaf0 0%,#e9d5b4 55%,rgba(226,196,152,0) 72%)}
#puff.go i{animation:puffOut var(--t,420ms) cubic-bezier(.2,.65,.4,1) var(--d,0ms) forwards}
@keyframes puffOut{
  0%{opacity:0;transform:translate(0,0) scale(.3)}
  16%{opacity:.92}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(var(--s,1.8))}
}
#puff i:nth-child(1){--dx:-46px;--dy:-2px;--s:2.1;--d:0ms;--t:430ms}
#puff i:nth-child(2){--dx:44px;--dy:-6px;--s:2.0;--d:20ms;--t:410ms}
#puff i:nth-child(3){--dx:-26px;--dy:-22px;--s:1.6;--d:40ms;--t:380ms}
#puff i:nth-child(4){--dx:28px;--dy:-26px;--s:1.6;--d:30ms;--t:390ms}
#puff i:nth-child(5){--dx:-8px;--dy:-34px;--s:1.3;--d:60ms;--t:360ms}
#puff i:nth-child(6){--dx:12px;--dy:-12px;--s:2.4;--d:0ms;--t:450ms}
@media (prefers-reduced-motion:reduce){#puff{display:none}}

/* The how-to is a panel hung under its own heading, out of the flow, and the
   star and the man are pushed to the floor of the screen. Between them the card
   fills the overlay, so opening and closing the panel moves nothing: COMECAR
   stays under the logo and he stays on the sand, which is the whole point of
   taking the text out of the column. */
#menu .card{height:100%;justify-content:flex-start}
/* The star has two homes. Closed, it sits just under "Como jogar" - near enough
   that the three read as one block, far enough off the words not to crowd them;
   opened, the panel wants that room, so the star drops to just above him. He
   never moves - his own auto margin keeps him on the sand either way, and the
   open state just hands the free space from below the star to above it. This is
   the one number to nudge if the group wants to sit tighter or looser. */
#menu .star{margin-top:18px}
#titleFoot{margin-top:auto;margin-bottom:100px}
/* The open state lifts the star a little closer to the text. 30px, and that is
   a ceiling, not a taste: measured to the LAST LINE of the how-to (not to
   #howtoBody, whose box runs well past it at max-height:62vh), a 1920x1080
   window has only 38px of room above the stars. 100px was tried and overshot -
   it hid them there and on a 390-wide phone.
   It is an offset and not margin-bottom because in this state the star is held
   by margin-top:auto and the open panel has already taken every pixel of slack
   on a normal desktop window: margin-bottom has nothing left to take, so it
   pushes the MAN down off the bottom edge instead. An offset leaves him alone.
   It is `top` and NOT `transform`, which was tried and broke on the way out: the
   star carries transition:transform .5s for the menu swipe, so closing the panel
   snapped the margins back to the closed home instantly while the transform
   crawled out over half a second - leaving the star sitting 30px high, on the
   "Como jogar" letters, for that whole half second. Only transform is
   transitioned here, so `top` lands at once in both directions. It is also out
   of flow, so placeStars still measures the real position the moment the class
   is toggled, and the swipe keeps its animation. */
#menu.howtoOpen .star,#menu.secretOpen .star{margin-top:auto;margin-bottom:50px;position:relative;top:-30px}
#menu.howtoOpen #titleFoot,#menu.secretOpen #titleFoot{margin-top:0}
.howtoWrap{position:relative}
#howtoBody{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);
  width:min(470px,92vw);display:flex;flex-direction:column;gap:10px;
  max-height:62vh;overflow:auto;text-align:center}
/* it is a button now, so strip the chrome and let it keep the heading's look */
#menu .howto{background:none;border:0;padding:2px 8px;cursor:pointer;display:inline-block;white-space:nowrap;font-size:48px}
#menu .card .row{justify-content:center}
/* no paper panel behind this text any more, so it carries its own ink outline */
#menu .card p{color:var(--paper);text-shadow:2px 2px 0 var(--ink),1px 1px 0 var(--ink),-1px 1px 0 var(--ink),1px -1px 0 var(--ink),-1px -1px 0 var(--ink)}
#menu .howto{color:var(--red);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
/* the key call-out inside the sentence: the display face in the CONFIRMA key's
   green with an ink stroke - what the "Space / Mash" row used to look like. The
   sentence reads "aperte a tecla VERDE", so the call-out is that same green and
   not the sun yellow it started as. text-shadow:none because it would otherwise
   inherit the paragraph's five-way ink shadow and turn to mud under the stroke. */
#howtoBody .key{color:var(--go);-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:none}
.card h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,10.5vw,86px);line-height:.88;letter-spacing:.03em;margin:0;color:var(--red);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--ink);white-space:nowrap;text-align:center}
.card h1 span{color:var(--red)}
.card p{margin:0;line-height:1.55;color:var(--muted)}
/* The how-to sentence is set large; the call-out inside it is em-based, so it
   stays proportionally bigger without having to be retuned alongside it.
   line-height:0.9 on the call-out stops it tearing a hole in the leading, and
   nowrap keeps "(espaço)" from splitting across lines. */
#menu #howtoBody p{font-size:26px;line-height:1.32}
.key{font-family:var(--display);font-size:1.5em;line-height:.9;letter-spacing:.04em;white-space:nowrap}
.howto{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:.04em;margin:0;color:var(--ink)}
.star{display:flex;justify-content:center;gap:10px;margin-top:2px;width:fit-content;margin-inline:auto}
.star svg{display:block}
/* ---- the secret ----
   The four stars are the one thing on this screen that does nothing, which is
   exactly what makes them the place to hide the studio logo.
   It opens into the SAME SLOT the how-to opens into - hung under the heading,
   with the stars stepping down out of the way on the shared class above - and
   that is not only for the look. Hung under the STARS instead, which is where
   it went first, it has to live in the gap between them and the man, and that
   gap is measured at 30px on a 1280x633 window against the 101px the logo
   needs: it sat across his chest. The how-to's slot is the one place on this
   screen already proven to hold a panel at every size, and the panel it holds
   is taller than this one. */
/* no cursor:pointer - the stars stopped being the way into the secret on
   2026-10-20 and a pointer on them would now be a lie */
/* 10% off the width and a little further down, asked for 2026-10-19. Both
   terms scale together so the logo keeps its size relative to the column on
   every window: 430 -> 387 and 86vw -> 77.4vw. The drop has a ceiling that is
   not taste - at 1280x633 the slot between the heading and the man is 113px
   and the logo now takes 91 of it, so 30px is nearly all the room there is. */
#saborosaBody{position:absolute;top:calc(100% + 30px);left:50%;transform:translateX(-50%);
  width:min(387px,77.4vw);cursor:pointer;isolation:isolate}
#saborosaBody img{width:100%;height:auto;display:block;filter:drop-shadow(3px 3px 0 var(--ink))}
/* The red, asked for 2026-10-19. MULTIPLY and not the colour blend the canvas
   scenes use, and that was decided by rendering all four candidates rather
   than by argument. `color` is the principled one - it keeps lightness and
   only moves hue - but every letter in this logo is LIGHT, so keeping their
   lightness keeps them pale: the result is a pink logo, not a red one.
   Multiplied by the menu's own red, the white letters land exactly on it, the
   tan and the yellow go to deeper reds under it, and the ink outlines come
   through untouched because anything times black is black. `hue-rotate` was
   the fourth candidate and the worst: it rotates what is already there, so
   five letter colours become five unrelated reds.
   The mask is what keeps the red on the ink and off the page - the layer is
   the whole panel box, and without it the multiply would darken the sky behind
   the transparent 36% of the file into a red rectangle. isolation:isolate on
   the parent stops the blend reaching past the panel for the same reason. */
#saborosaBody::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:var(--red);mix-blend-mode:multiply;
  -webkit-mask:url('assets/new/saborosa-logo.webp') center/100% 100% no-repeat;
          mask:url('assets/new/saborosa-logo.webp') center/100% 100% no-repeat}
/* #titleFoot is the patch of sand he stands on: it holds his height, and it is
   what the layout moves around. #titleSpr climbs out of it and the dust stays
   in it, both anchored to the same bottom edge - so the dust is at his feet by
   construction, with nothing measured and nothing to go stale. */
/* flex:none - he is the one thing in this column that must never be squashed to
   make room; everything else gives first. */
#titleFoot{position:relative;width:100%;height:calc(clamp(92px,17vh,165px)*var(--manScale));flex:none}
#titleSpr{position:relative;width:100%;height:100%}
/* All three poses live in the DOM and are decoded up front. Swapping an <img>
   src at the instant the flight transform starts made Chrome rasterise the
   compositor layer before the new image had decoded, and it never repainted
   during the animation - the sprite vanished for the whole climb. Firefox
   rasterised differently and hid the bug. Switching opacity cannot race. */
#titleSpr .pose{position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:100%;width:auto;opacity:0}
#titleSpr .pose.on{opacity:1}
/* Each sheet draws the man at its own scale and frames him differently, so
   sizing every pose to the frame (height:100%) quietly resized HIM between
   poses instead of only changing the pose. Two separate problems:
     - the crouch art is drawn 17.5% bigger than the standing art (hat brim 134
       vs 114px, widest row 236 vs 201 - two landmarks agreeing) at the same
       frame height, so crouching read as a zoom-in with his head staying put;
     - the takeoff sprite spends its top ~14% on the raised fist, so only 314 of
       its 367px are the man. Matched by frame height he came out a head shorter
       than when standing, which is the opposite of taking off.
   Both heights below were calibrated against the standing pose - the crouch by
   body scale, the takeoff by his hat-to-feet height - with the feet pinned to
   the ground by bottom:0. He is now one size through the whole move, and the
   fist is free to reach above the frame. */
/* The two recipes, so these can be re-derived if POSE_FIGURE ever changes.
   Measure each sliced figure's pixel height h and its widest opaque row W:
     crouch% = (W/h of the standing figure) / (W/h of the crouch figure)
     fly%    = h / (h - the rows the raised fist occupies above the hat)
   Figure 2 (smallest): crouch 84.6%, fly 117.3%  <- what these were before
   Figure 1 (middle, current): crouch 90.4%, fly 118.2%
   The crouch moves a long way between the two because the middle figure stands
   much narrower (316/600 against the smallest's 236/411), which is art, not scale.
   (these need the #titleSpr prefix: a bare id loses to "#titleSpr .pose" above) */
#titleSpr #poseStern{height:100%}
#titleSpr #poseCrouch{height:90.4%}
#titleSpr #poseFly{height:118.2%}    /* >100% on purpose: the fist is above his hat */
button{font:inherit;cursor:pointer;color:var(--ink)}
.primary{font-family:var(--display);font-size:30px;letter-spacing:.05em;background:var(--sun);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:6px 20px}
.primary:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:focus-visible{outline:3px solid var(--ki);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
/* COMECAR carries the same treatment as the "Como jogar" heading - same display
   face, same red, same ink outline and offset shadow, and no box at all. Scoped
   to the menu so the result screen's Again button keeps its yellow box. */
/* One size for both options, fixed: 48px is what the old width-matching came out
   at for COMECAR on a desktop, and COMO JOGAR now simply matches it and runs
   wider, as the longer word should. nowrap is load-bearing - at this size a wrap
   would break the line in half. */
#menu .primary,#endUI .primary{background:none;border:0;box-shadow:none;padding:6px 16px;white-space:nowrap;
  font-size:48px;letter-spacing:.04em;color:var(--red);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
#menu .primary:active,#endUI .primary:active{transform:translate(2px,2px);box-shadow:none;text-shadow:1px 1px 0 var(--ink)}
/* ---- VOTAR DE NOVO ----
   The way back, on the settled crowd shot. It is a menu option that happens to
   be on another screen, so it takes #menu's own selectors above rather than a
   copy of their numbers - same red, same ink stroke, same 48px, and the same
   two steps down on small screens, with one place to change any of them.
   It is deliberately NOT .overlay: that class lays a dark wash over the whole
   stage, which would put a scrim across the photograph this screen exists to
   show.
   top is a percentage of the STAGE HEIGHT, which is the only reason it is
   written as `top` on an absolutely positioned box rather than as a margin -
   a percentage margin-top resolves against the container's WIDTH, which on a
   desktop would have thrown it far down the picture. 9% puts it in the sky at
   every aspect that was measured: the horizon sits at 32% of the frame down the
   middle on a desktop and 44% on a phone, and the button's own box ends around
   18%, so it clears both with room. pointer-events are off on the box and back
   on for the button, so the dead space around it does not eat taps meant for
   the canvas. */
#endUI{position:absolute;left:0;right:0;top:9%;display:flex;justify-content:center;
  padding:0 16px;pointer-events:none;z-index:5}
#endUI .primary{pointer-events:auto;animation:endIn .45s ease-out both}
@keyframes endIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#endUI .primary{animation:none}}
/* Choosing an option punches its letters: a hard overshoot, a squash past the
   resting size, and a small settle. It is an animation rather than a transition
   so that re-triggering it restarts cleanly, and so it overrides the :active
   nudge while it runs instead of fighting it. */
@keyframes punch{
  0%{transform:scale(1)}
  18%{transform:scale(1.26)}
  42%{transform:scale(.92)}
  66%{transform:scale(1.07)}
  100%{transform:scale(1)}
}
#menu .punched,#endUI .punched{animation:punch .3s cubic-bezier(.25,.8,.35,1)}
@media (prefers-reduced-motion:reduce){#menu .punched,#endUI .punched{animation:none}}
@media (prefers-reduced-motion: reduce){ .primary:active{transform:none} }
/* ---- phone ----
   Only sizes and spacing: every screen keeps the same structure, so nothing
   here can reach a desktop window. */
@media (max-width:560px){
  #menu .card{gap:7px;padding-top:194px}   /* the logo spans the width here, so it must clear the toggles button */
  #menu .howto,#menu .primary,#endUI .primary{font-size:37px}   /* phone: the stars are smaller here too */
  #menu .card p{font-size:13px;line-height:1.4}
  #menu #howtoBody p{font-size:20px;line-height:1.3}
  .star svg{width:42px;height:40px}
}
/* 150px of head room and 100px under his feet is more than a 720p-tall window
   has to give once the options are set to the width of the stars; the offsets
   scale back here so everything still fits on screen. */
@media (max-height:780px){
  /* These two gave ground again when the character moved to the middle figure's
     scale: he is half again as tall as the art this column was first laid out
     for, and a 720p-tall window had no 50px to spare. The card overflows the
     viewport here and is centred in it, so every pixel of height costs HALF a
     pixel at his feet - which is why the numbers moved this far to buy back the
     15px he was overrunning by. */
  #menu .card{padding-top:36px}
  #titleFoot{margin-bottom:30px}
  #menu .star{margin-bottom:20px}
}
/* nothing like 150px of head room exists on a sideways phone */
@media (max-height:520px){
  #menu .card{padding-top:60px}
  #titleFoot{margin-bottom:24px}
  #menu .star{margin-bottom:16px}
}
/* a short phone (SE-sized, or landscape) cannot fit the full how-to column.
   This breakpoint is about the how-to COLUMN. The one about a screen being too
   short for anything at all is the 520 block below, which is where --tiny
   lives. */
@media (max-height:700px) and (max-width:900px){
  #menu .howto,#menu .primary,#endUI .primary{font-size:30px}   /* short screens have to give some of it back */
  #menu .card p{font-size:12px}
  #menu #howtoBody p{font-size:17px;line-height:1.28}
  #titleFoot{height:calc(clamp(66px,12vh,120px)*var(--manScale))}
  /* The stars are hidden here ONLY while a panel is out, which is the state that
     genuinely has no room - see the measurement in the comment below. They used
     to be hidden at this size unconditionally, and on 2026-10-20 the user
     reported them missing on an iPhone while an Android friend saw them: a real
     iPhone lands in this breakpoint whenever Safari's toolbars show, so it was
     always the closed state paying for the open state's problem. Measured at
     500x580 closed: 184px of dead space between "Como jogar" and the man, and
     the row needs 40px, so it fits with 27px to spare and no overlap.
     Keeping the hide scoped to the open state is also what keeps the
     compensation below correct, since that rule is only right while the star
     is out of the flow. */
  #menu.howtoOpen .star,#menu.secretOpen .star{display:none}
  /* the star is what carries margin-top:auto when a panel is open, so he has to
     carry it himself here or there is nothing left to push him down to the sand */
  #titleFoot{margin-top:auto}
  /* ...and he has to keep carrying it with the panel OPEN. The open state hands
     the auto margin to the star, which is display:none at this size, so it went
     to nothing at all: `#menu.howtoOpen #titleFoot{margin-top:0}` outranks the
     rule above on specificity and stripped it back off, and with nothing left
     pushing him down he landed right under the heading - the middle of the
     screen, on top of the how-to text. Reported on a phone 2026-10-16 and
     measured at 375x667: his box jumped 282px up the moment COMO JOGAR was
     tapped. A real iPhone lands in this breakpoint whenever Safari's toolbars
     are showing, which is most of the time. */
  #menu.howtoOpen #titleFoot,#menu.secretOpen #titleFoot{margin-top:auto}
}
/* ...and a GENUINELY short screen cannot hold the row even closed, so there the
   stars still go entirely. Swept 2026-10-20 with the row forced on: his box
   starts hanging off the bottom below about 473px of viewport height - 18px off
   at 433, 102px off at 313 (a landscape phone). Hiding at 520 keeps a margin
   over that and lands in a wide empty band: a phone in landscape gives roughly
   280-390px of height, while the shortest iPhone in PORTRAIT with Safari's
   toolbars out is about 553 (SE; 664 on a 14), so the two cases separate
   cleanly and no real portrait phone loses its stars.
   520 is also already this sheet's short-screen breakpoint, just without the
   width term, which this needs so a short-but-wide desktop window keeps the
   behaviour it has always had. */
@media (max-height:520px) and (max-width:900px){
  .star{display:none}
  /* The same "genuinely too short" line the secret refuses to open across, and
     it is one line rather than two because the two were measured to the same

     63px at 580). --tiny is this number's only written-down form - the JS reads

<script>
(()=>{
const TAU=Math.PI*2, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t,
  rand=(a,b)=>a+Math.random()*(b-a), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const stage=document.getElementById('stage'), cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
let W=800,H=450,DPR=1;
/* ---------- framing ----------
   PORT is the one flag the whole file hangs its portrait differences off:
   taller than it is wide, by a margin no desktop window has. A landscape
   window - which is what every desktop is - therefore runs the code it always
   ran, and the jump at the switch sits at a square window, which nobody plays
   at. SU and SH went with the fight: they existed because phase 1 composed
   everything against the frame height and had to be re-based on the width in
   portrait, and because it drew inside the screen minus the urna dock. The
   corridor does neither - it reads W and H directly, and its machine is drawn
   on top of the scene rather than in a strip taken out of it. */
let PORT=false;
const URNA_AR=1024/1536;      // assets/new/urna-*.webp, all three frames
function reframe(){PORT=H>W*1.1;}
function resize(){const r=stage.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(240,r.height);DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);reframe();}
addEventListener('resize',resize);
// rotating a phone can report the new size a frame late, and the visual viewport
// moves on its own when the browser chrome slides away
addEventListener('orientationchange',()=>setTimeout(resize,120));
if(window.visualViewport)visualViewport.addEventListener('resize',resize);
resize();

/* ---------- settings ----------
   This was a panel of radio buttons once, then a row of constants the scenes
   read as S.something. Everything else in it belonged to the fight and went
   with it; the music switch is what is left, kept in the object because
   turning it into a choice again only means putting a control back on top of
   it. Nothing is persisted: with no way to change a setting, a value left in
   localStorage by an older build could only do harm. */
const S={music:'on'};
/* ---------- sprite strips ----------
   The title character's three poses are each a row of three figures on green.
   sliceStrip keys the green out, splits the row and returns the figures; the
   caller keeps one of them (see POSE_FIGURE). It also used to cut the fight's
   hero sheets - hero-front2.png through sliceSheet, hero-back2.png through
   this - and those sheets, both loaders and the placeholder hero that stood in
   for them went with the fight on 2026-10-16. */
function sliceStrip(img){
  const m=Math.min(1,1800/img.naturalWidth),W0=Math.round(img.naturalWidth*m),H0=Math.round(img.naturalHeight*m);
  const c=document.createElement('canvas');c.width=W0;c.height=H0;const x=c.getContext('2d');x.drawImage(img,0,0,W0,H0);
  const id=x.getImageData(0,0,W0,H0),d=id.data;
  // key out green: alpha falls as green dominates red and blue; pull green spill back on the edges
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,b),sp=g-mx;
    if(g>=120&&sp>30){const a=clamp(1-(sp-30)/90,0,1);d[i+3]=Math.round(d[i+3]*a);}
    if(sp>0)d[i+1]=Math.round(mx+sp*.15);}
  x.putImageData(id,0,0);
  const cols=new Uint32Array(W0);for(let y=0;y<H0;y++)for(let i=0;i<W0;i++)if(d[(y*W0+i)*4+3]>40)cols[i]++;
  const segs=[];let st=-1;for(let i=0;i<=W0;i++){const on=i<W0&&cols[i]>2;if(on&&st<0)st=i;if(!on&&st>=0){segs.push([st,i-1]);st=-1;}}
  const merged=[];for(const sg of segs){const l=merged[merged.length-1];if(l&&sg[0]-l[1]<W0*.02)l[1]=sg[1];else merged.push([...sg]);}
  const big=merged.filter(sg=>sg[1]-sg[0]>W0*.08).slice(0,3);
  if(big.length<3)throw new Error('need 3 poses');
  return big.map(([x0,x1])=>{let y0=H0,y1=0;for(let y=0;y<H0;y++)for(let i=x0;i<=x1;i++)if(d[(y*W0+i)*4+3]>40){if(y<y0)y0=y;if(y>y1)y1=y;break;}
    const t=document.createElement('canvas');t.width=x1-x0+1;t.height=y1-y0+1;t.getContext('2d').drawImage(c,x0,y0,t.width,t.height,0,0,t.width,t.height);return t;});
}
/* Title-screen character, two poses. Each sheet holds the same figure at three
   scales on green; sliceStrip keys the green and splits the row, and we keep one
   of them. Hovering on the menu, fist-up once he takes off.
   POSE_FIGURE picks which: 0 biggest, 2 smallest. It is NOT just a resolution
   choice - the three are drawn differently (the middle one is slimmer and finer
   featured, and its crouch takes a much narrower stance), and the three CSS
   heights under #titleSpr are calibrated against whichever is chosen, as is
   --manScale. Change this and those four numbers have to be re-derived; the
   recipe and the measured values for figures 1 and 2 are written down there. */
const POSE_FIGURE=1;
const POSE={stern:$('poseStern'),crouch:$('poseCrouch'),fly:$('poseFly')};
function setTitleSprite(name){
  const el=$('titleSpr');if(!el||!POSE[name]||!POSE[name].src)return;
  for(const k in POSE)POSE[k].classList.toggle('on',k===name);
  el.hidden=false;
}
function loadPose(file,el,after){const i=new Image();
  i.onload=()=>{try{
    const f=sliceStrip(i);el.src=f[Math.min(POSE_FIGURE,f.length-1)].toDataURL('image/png');
    // force the decode now, while nothing is animating
    const d=el.decode?el.decode().catch(()=>{}):Promise.resolve();
    if(after)d.then(after);
  }catch(e){}};
  i.src=encodeURI(file);}
// standing on the menu...
loadPose('assets/new/Three Stern Suit-Wearing Elders.webp',POSE.stern,
  ()=>{if(INTRO.state==='idle')setTitleSprite('stern');});
// ...a glimpse of him braced to jump the moment COMECAR is hit...
// (same sheet dimensions and the same three scales as the standing sheet, so its
//  smallest figure is 411px tall against the standing one's 414 - the pose reads
//  as a crouch through the widened stance, not through height, and .pose's
//  height:100% needs no correction for it.)
loadPose('assets/new/Three Stern Suit-Clad Figures.webp',POSE.crouch);
// ...and straight out of it into the climb, fist-first. There is no hovering
// frame in between any more: he crouches and goes.
// Both are pre-decoded so neither swap can flash mid-transition.
loadPose('assets/new/Three-scale Lula takeoff sprite sheet.webp',POSE.fly);

/* ---------- audio ---------- */
let AC=null,master,noiseBuf;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();applyMusic();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=.8;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    initMusic();
  }catch(e){AC=null}
}
/* Background music. It goes STRAIGHT TO THE DESTINATION rather than through
   master, and MUSIC_VOL below is pre-multiplied for master's missing .8 because
   of it. The reason was phase 1: it slammed master to 0 for the silence beats
   and under each boom, which dropped anything routed through it for a second or
   two. Those beats went with the fight and nothing moves master any more - but
   the routing and the level are a matched pair, so they stay matched rather
   than both being "tidied" at once. The sound effects still run through it. */
const MUSIC_FILE='assets/sequencia-13.mp3', MUSIC_VOL=.27;   // .34 x master's .8, now that master is out of the path
let MUSIC=null,musicGain=null;
const musicHint=t=>{const h=$('musicHint');if(h)h.textContent=t;};
function initMusic(){
  musicGain=AC.createGain();musicGain.gain.value=0;musicGain.connect(AC.destination);
  MUSIC=new Audio(MUSIC_FILE);MUSIC.loop=true;MUSIC.preload='auto';
  MUSIC.addEventListener('canplay',()=>musicHint('sequencia-13.mp3 loaded.'),{once:true});
  MUSIC.addEventListener('error',()=>{MUSIC=null;musicHint(MUSIC_FILE+' not found. The game runs without music.');});
  try{AC.createMediaElementSource(MUSIC).connect(musicGain);}
  catch(e){MUSIC=null;musicHint('Could not route the music. Open the page through a web server, not as a local file.');return;}
  applyMusic();
}
function applyMusic(){
  if(!AC||!MUSIC)return;
  const on=S.music!=='off';
  musicGain.gain.cancelScheduledValues(AC.currentTime);
  musicGain.gain.setTargetAtTime(on?MUSIC_VOL:0,AC.currentTime,.08);
  if(on)MUSIC.play().catch(()=>musicHint('Music is blocked until you click or press a key.'));
  else setTimeout(()=>{if(S.music==='off'&&MUSIC)MUSIC.pause();},300);
}
function tone(type,f0,f1,dur,vol,delay=0){
  if(!AC)return;const t=AC.currentTime+delay;const o=AC.createOscillator();o.type=type;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(master);o.start(t);o.stop(t+dur+.02);
}
function noise(dur,vol,freq,type='lowpass',delay=0){
  if(!AC)return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=noiseBuf;
  const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;
  const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur+.05);
}

/* ---------- static scenery ---------- */
const STARS=Array.from({length:200},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.4+.3,a:Math.random()*.7+.2}));
const LANDS=Array.from({length:16},()=>({a:Math.random()*TAU,r:Math.sqrt(Math.random())*.8,s:rand(.08,.22),k:rand(.5,1)}));
const THREADS=Array.from({length:90},()=>({a:Math.random()*TAU,r:Math.sqrt(Math.random())*.95,d:Math.random()*.55}));

/* ---------- game state ----------
   Two phases: the title screen, and the corridor the game now lives in. The
   fight that used to follow it went on 2026-10-16 - gather, the aiming grid,
   the throw, the disintegration, the orbit endings and the result card, with
   the grids, the attack clock and the hit/brace tally that fed them. The
   corridor keeps all of its own state in G.corr*, set up by toCorridor().
   lastMash is seeded because the machine's frame is read off it from the very
   first draw, before anything has been pressed. */
let G={phase:'menu',t:0,pt:0,lastMash:-9};
function setPhase(p){G.phase=p;G.pt=0;}

/* ---------- input ---------- */
addEventListener('keydown',e=>{
  const k=e.code;
  if(k==='Space')e.preventDefault();
  /* Any key starts the run, except on the Como jogar control, where a key press
     means "open this" - and except for the two cases the secret word needs.
     MODIFIERS fall through doing nothing: Shift and CapsLock each fire a
     keydown of their own, and they are exactly how the word gets typed in
     upper case, so starting the run on them would make the secret untypeable.
     LETTERS are reserved for spelling it, so they no longer start the run
     either; Space, Enter and every other key still do, which is the path the
     COMECAR button and a tap on the canvas already share. */
  if(G.phase==='menu'&&!(e.target&&e.target.closest&&e.target.closest('.howtoWrap'))){
    if(/^(Shift|Control|Alt|Meta|CapsLock)$/.test(e.key))return;
    if(e.key.length===1&&/[A-Za-z]/.test(e.key)){secretType(e);return;}
    beginStart();return;
  }
  if(e.repeat)return;
  if(k==='Space'||k==='Enter'){
    if(G.phase==='corridor')corrMash();
  }
});
cv.addEventListener('pointerdown',e=>{
  audioInit();
  if(G.phase==='menu'){beginStart();return;}
  if(G.phase==='corridor'){e.preventDefault();corrMash();return;}   // tap anywhere to mash
});
/* pointerdown so it lands with the finger rather than after it lifts; the
   click branch is for keyboard activation, which reports detail 0 */
function punch(el){el.classList.remove('punched');void el.offsetWidth;el.classList.add('punched');}
for(const el of [$('bStart'),$('bHowto')]){
  el.addEventListener('pointerdown',()=>punch(el));
  el.addEventListener('click',e=>{if(!e.detail)punch(el);});
}
const howtoBtn=$('bHowto');
/* The open panel floats over the column, so on a short window its text can reach
   the stars it just pushed down to. Rather than guess a breakpoint, measure:
   the stars step aside only when the panel actually arrives on top of them, so
   they stay visible on a phone and on a tall screen, where there is room. */
function placeStars(){
  const star=document.querySelector('#menu .star');
  if(!star)return;
  // whichever panel is out - they share the slot, so there is never more than one
  const open=!$('howtoBody').hidden?$('howtoBody'):(!$('saborosaBody').hidden?$('saborosaBody'):null);
  if(!open){star.style.visibility='';return;}
  const panel=open.getBoundingClientRect(), sr=star.getBoundingClientRect();
  star.style.visibility=sr.top<panel.bottom+6?'hidden':'';
}
howtoBtn.addEventListener('click',()=>{
  const open=howtoBtn.getAttribute('aria-expanded')==='true';
  howtoBtn.setAttribute('aria-expanded',open?'false':'true');
  $('howtoBody').hidden=open;
  $('menu').classList.toggle('howtoOpen',!open);
  closeSecret();   // the two share one slot, so only ever one of them is out
  placeStars();
});
/* ---- the secret ----
   Type SABOROSA on the title screen and the studio logo appears, on the same
   toggle and in the same slot the how-to runs on. Clicking the stars was the
   way in until 2026-10-20; the user replaced it with the word, so the row is
   now purely decorative - it keeps its aria-hidden and has lost its click
   handler and its cursor:pointer.

   UPPER CASE IS REQUIRED, and that is the whole reason this reads e.key and
   not e.code: e.code is 'KeyS' whether or not Shift is down, while e.key is
   the character actually produced, so an 'S' means the player really did hold
   Shift or set CapsLock. Both routes work because both produce the same e.key.

   A lower-case letter is still appended rather than ignored, and that matters:
   ignoring it would let 'SABORxOSA' match with a lower-case x, because the x
   would simply vanish from the buffer. Appending makes a wrong case BREAK the
   run, which is what "precisa ser caixa alta" has to mean.

   Typing is inherently a physical-keyboard gesture, so unlike the old click
   there is no way to reach this on a phone at all. The size guard is still
   needed for a short desktop window - see secretType(). */
function closeSecret(){$('saborosaBody').hidden=true;$('menu').classList.remove('secretOpen');}
/* The one JS reader of the short-screen breakpoint. The number itself stays in
   the stylesheet as --tiny, so there is nothing here to drift out of step. */
function tooSmallForPanel(){
  return getComputedStyle(document.documentElement).getPropertyValue('--tiny').trim()==='1';
}
/* The buffer keeps only the last 8 characters typed, which is what makes a
   mistyped attempt free: SABOTOSASABOROSA opens it on the second word, because
   by then the last 8 ARE the word. A sliding window also handles an overlap for
   nothing, where an index-and-reset would not - SASABOROSA ends on the right 8. */
const SECRET_CODE='SABOROSA';
let secretBuf='';
function secretType(e){
  if(e.repeat)return;   // a held letter would otherwise fill the window with itself
  secretBuf=(secretBuf+e.key).slice(-SECRET_CODE.length);
  if(secretBuf!==SECRET_CODE)return;
  secretBuf='';         // so typing it again toggles, rather than re-opening what is open
  /* Too short a window to hold the panel: it would sit across the man, the same
     thing the resize handler below guards against. Read off the --tiny custom
     property rather than the star row's offsetParent, because the row is
     visible at this size again as of 2026-10-20 and would no longer report it. */
  if(tooSmallForPanel())return;
  toggleSecret();
}
function toggleSecret(){
  const body=$('saborosaBody');
  if(!body.hidden){closeSecret();placeStars();return;}
  /* Closing the how-to FIRST, and the order is the whole of it: that toggle
     calls closeSecret as part of its own one-at-a-time rule, so opening this
     before closing that put the logo up and took it straight back down. */
  if(howtoBtn.getAttribute('aria-expanded')==='true')howtoBtn.click();
  body.hidden=false;$('menu').classList.add('secretOpen');
  placeStars();
  // a keypress is as good a user gesture as the click used to be, so this is
  // still a legal place to wake the audio
  audioInit();tone('square',760,1180,.11,.05);tone('square',1140,1520,.09,.035,.06);
}
/* Decoration now: no click handler, and no longer the size probe either - see
   tooSmallForPanel(). placeStars() is the only thing that still touches it. */
const starRow=document.querySelector('#menu .star');
/* The logo closes itself, and with the stars retired this carries more weight
   than it used to: clicking it is now the ONLY way out other than typing the
   word a second time, and a secret you cannot shut is a trap rather than a
   joke. */
$('saborosaBody').addEventListener('click',toggleSecret);
/* A panel left open across a resize into a short window sits on the man -
   measured at 844x303: 101px of overlap. That, not the lost click target, is
   why the secret does not survive the window getting small; it is the same
   reason secretType() refuses to open it there in the first place. */
addEventListener('resize',()=>{
  if(tooSmallForPanel()&&!$('saborosaBody').hidden)closeSecret();
  placeStars();
});
$('bStart').addEventListener('click',beginStart);
/* ---- VOTAR DE NOVO ----
   Back to the title screen rather than straight into another run, and the
   reason is the music: the corridor is clocked off MUSIC.currentTime, and the
   three punches only land on the stabs when the song is in the same place
   relative to the run that it is on a fresh load. Going through the title
   reuses that path exactly - COMECAR rewinds the track and the intro spends
   its usual ~1.8s before toCorridor() reads the clock - instead of a second,
   parallel way of starting a run whose sync could not be tested here at all
   (headless Chrome's virtual clock cannot verify timing).
   introTick() has already cleaned up after itself by the time this can be
   reached: INTRO is back to idle and the leaving/flying classes are off. So
   this only has to put the menu back and wind the corridor's own state to
   where toCorridor() expects to find it. */
function voteAgain(){
  $('endUI').hidden=true;
  G.again=false;G.corrOver=-1;G.corrCut=-1;G.frags=null;G.corrSmoke=[];
  setPhase('menu');
  setTitleSprite('stern');
  $('menu').hidden=false;
  $('puff').classList.remove('go');   // the climb's dust, left mid-animation
  placeStars();
}
$('bAgain').addEventListener('pointerdown',()=>punch($('bAgain')));
$('bAgain').addEventListener('click',e=>{if(!e.detail)punch($('bAgain'));voteAgain();});


/* ---------- main loop ---------- */
let last=performance.now();
function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  G.t+=dt;G.pt+=dt;
  introTick(dt);
  update(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  draw();
  requestAnimationFrame(loop);
}
/* The corridor is the only phase with a clock. The title screen runs on its
   own CSS and on introTick, and the fight's switch - gather, silence, aim,
   throw, disint, the two orbit endings, pushin, missText - went with it. */
function update(dt){
  if(G.phase!=='corridor')return;
  while(G.corrBeat<G.corrHits.length&&G.pt>=G.corrHits[G.corrBeat])corridorHit(G.corrBeat++);
  // the charge bleeds all the way through, including up at the globe: the
  // machine is still there to be pressed, so there is still something to lose
  G.corrE=Math.max(0,(G.corrE||0)-CORR_DECAY*dt);
  corrFullTick(dt);
  corrSmokeTick(dt);
}

/* ---------- art: palette, background, planet ---------- */
const INK='#1b1512', SKY='#1a88f9', DUST='#e8b066', DUST_D='#d6984f', ORB_B='#8fd8ff', ORB_L='#d4f3ff', KI='#ff5a2a';
const BG1=new Image();BG1.src='assets/bg-gathering.jpg';const BG1_HZ=724/941;
// Title screen backdrop. fundo-1.webp is a tall 1024x1536 scene; the title screen
// shows ONLY its bottom third (the horizon + ground band). The upper two thirds are
// deliberately left unrendered here - they are for in-game use later.
const FUNDO=new Image();FUNDO.src='assets/fundo-1.webp';
/* Landscape keeps the bottom third it was framed for. A phone takes a taller
   slice: a third of a 1024-wide image stretched over a portrait screen is a 1.6x
   upscale of the sky, while 60% of it lands just under 1:1 - sharper, and it
   shows more of the scene the shot was painted for. */
const FUNDO_PART=1/3, FUNDO_PART_PORT=.6;
const TITLE_DROP=50;   // screen px the framing sits lower, i.e. how much extra sky shows on top
function drawFundoTitle(pan=0){
  if(!FUNDO.complete||!FUNDO.naturalWidth)return false;
  const iw=FUNDO.naturalWidth,ih=FUNDO.naturalHeight;
  const sh=Math.round(ih*(PORT?FUNDO_PART_PORT:FUNDO_PART));   // bottom slice of the backdrop
  const k=Math.max(W/iw,H/sh),w=iw*k,h=sh*k;            // cover-fit that crop
  // The crop is wider than the canvas, so cover-fit is height-constrained: h===H and
  // there is no vertical slack to slide the destination into. Push the framing down by
  // taking the source window TITLE_DROP screen px higher up the image instead.
  // pan 0 = title framing; pan 1 = sy 0, the top of the image, i.e. open sky.
  // This is what the upper two thirds of fundo-1.webp were being kept for.
  const sy=Math.max(0,ih-sh-TITLE_DROP/k)*(1-pan);
  ctx.drawImage(FUNDO,0,sy,iw,sh,(W-w)/2,(H-h)/2,w,h);
  return true;
}
/* fitH is the height the backdrop has to cover. It is the full screen everywhere
   except phase 1 in portrait, where the scene stops above the urna dock - fitting
   a landscape photo to the whole phone instead would push its horizon off the
   bottom and leave the ground as a flat band of fill colour. */
function drawBG(img,hzY,zoom=1,fitH=H){
  const HZ=img.hz||BG1_HZ;
  // cover-fit, horizon of the image lands on hzY
  if(!img.complete||!img.naturalWidth){ctx.fillStyle=SKY;ctx.fillRect(0,0,W,hzY);ctx.fillStyle=DUST;ctx.fillRect(0,hzY,W,fitH-hzY);return;}
  const s=Math.max(W/img.naturalWidth,fitH/img.naturalHeight)*zoom, w=img.naturalWidth*s, h=img.naturalHeight*s;
  const x=(W-w)/2, y=hzY-HZ*h;
  if(y>0){ctx.fillStyle=SKY;ctx.fillRect(0,0,W,y+1);}
  if(y+h<fitH){ctx.fillStyle=DUST_D;ctx.fillRect(0,y+h-1,W,fitH-y-h+1);}
  ctx.drawImage(img,x,y,w,h);
}

/* The planet, and the point on it the energy gathers into. BRAZIL is that
   point on assets/planet.jpg, as a fraction of the disc's radius out from its
   centre; the angle is for the procedural globe drawn below when the photo is
   missing, which has no Brazil to aim at. The miss variant of the point, and
   the panel-era loader that let a planet be dropped in at runtime, both went
   with the fight - every shot that is left lands on target. */
const PART=new Image();PART.src='assets/planet.jpg';
const BRAZIL=[.227,.278];
const artReady=()=>PART.complete&&PART.naturalWidth>0;
function planetTarget(cx,cy,R,ang){
  if(artReady())return {x:cx+BRAZIL[0]*R,y:cy+BRAZIL[1]*R};
  return {x:cx+Math.cos(ang)*R*.9,y:cy+Math.sin(ang)*R*.9};
}
/* ---------- drawing helpers ---------- */
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);}
function inkStroke(w){ctx.lineWidth=w;ctx.strokeStyle=INK;ctx.lineJoin='round';ctx.lineCap='round';ctx.stroke();}
function sparkle(x,y,s,fill='#fff'){
  ctx.beginPath();const p=[[0,-1],[.2,-.2],[1,0],[.2,.2],[0,1],[-.2,.2],[-1,0],[-.2,-.2]];
  p.forEach(([a,b],i)=>i?ctx.lineTo(x+a*s,y+b*s):ctx.moveTo(x+a*s,y+b*s));ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=Math.max(1,s*.12);ctx.strokeStyle='rgba(40,110,200,.8)';ctx.stroke();
}
/* A classic five-point star, the same shape the menu's four stars are cut from:
   outer points at the radius, inner points at .382 of it, which is the 1/phi^2
   the SVG in the markup works out to. Upright and unrotated on purpose - it
   reads as the mark, not as a twinkle.
   sparkle() above stays exactly as it was: the starfield and the fight's orb
   both draw it, and neither asked for this. */
function star5(x,y,s,rot,fill,stroke){
  ctx.beginPath();
  for(let i=0;i<10;i++){
    const a=rot-Math.PI/2+i*Math.PI/5, rr=(i%2?s*.382:s);
    const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
    i?ctx.lineTo(px,py):ctx.moveTo(px,py);
  }
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  // the outline is optional: on sky the red carries on its own, and an ink edge
  // on something this small just thickens it
  if(stroke){ctx.lineWidth=Math.max(1,s*.14);ctx.lineJoin='round';ctx.strokeStyle=stroke;ctx.stroke();}
}
function drawStars(alpha=1,ox=0,oy=0){
  ctx.fillStyle='#fff';
  STARS.forEach((s,i)=>{const x=((s.x*W+ox)%W+W)%W,y=((s.y*H+oy)%H+H)%H;ctx.globalAlpha=s.a*alpha;
    if(i%23===0){ctx.globalAlpha=alpha;sparkle(x,y,3+s.s*2.5*(.7+.3*Math.sin(G.t*3+i)));}else ctx.fillRect(x,y,s.s+.4,s.s+.4);});
  ctx.globalAlpha=1;
}
function spaceBG(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0e2050');g.addColorStop(1,'#060f2a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
function drawPlanet(cx,cy,R){
  // atmosphere rim: flat bands
  ctx.fillStyle='rgba(120,200,255,.18)';circ(cx,cy,R*1.09);ctx.fill();
  ctx.fillStyle='rgba(150,215,255,.35)';circ(cx,cy,R*1.04);ctx.fill();
  if(artReady()){
    ctx.save();circ(cx,cy,R);ctx.clip();ctx.drawImage(PART,cx-R,cy-R,R*2,R*2);ctx.restore();
    circ(cx,cy,R);inkStroke(Math.max(2.5,R*.012));return;
  }
  ctx.fillStyle='#2f7fe0';circ(cx,cy,R);ctx.fill();
  ctx.save();circ(cx,cy,R);ctx.clip();
  for(const l of LANDS){const x=cx+Math.cos(l.a)*l.r*R,y=cy+Math.sin(l.a)*l.r*R;
    ctx.beginPath();ctx.ellipse(x,y,l.s*R,l.s*R*.62,l.a,0,TAU);ctx.fillStyle=l.k>.75?'#d9b06a':'#6db84f';ctx.fill();inkStroke(1.5);
    ctx.beginPath();ctx.ellipse(x+l.s*R*.25,y+l.s*R*.18,l.s*R*.6,l.s*R*.3,l.a,0,TAU);ctx.fillStyle=l.k>.75?'#b98c4c':'#4f9a3a';ctx.fill();}
  for(const l of LANDS.slice(0,7)){const x=cx+Math.cos(l.a+1)*l.r*R*.9,y=cy+Math.sin(l.a+1)*l.r*R*.9;
    ctx.beginPath();ctx.ellipse(x,y,l.s*R*.8,l.s*R*.22,l.a*.3,0,TAU);ctx.fillStyle='#fff';ctx.fill();inkStroke(1.2);}
  ctx.fillStyle='rgba(8,20,60,.45)';ctx.beginPath();ctx.rect(cx-R,cy-R,R*2,R*2);ctx.arc(cx-R*.16,cy-R*.18,R*1.06,0,TAU,true);ctx.fill();
  ctx.restore();circ(cx,cy,R);inkStroke(Math.max(2.5,R*.012));
}
/* The orb's colours, lifted out so the same ball can be charged in two places.
   ORB_COOL is exactly what drawSphere had hard-wired. Nothing reaches it any
   more - both trips up went red on 2026-10-19 - so it is no longer a palette
   in use but the way BACK to a blue ball: put it in either shot's `pal` and
   swap that shot's FEED_HOT for FEED_COOL below. Kept for that reason, and
   because drawSphere still needs a default. */
const ORB_COOL={g1:'rgba(120,205,255,.22)',g2:'rgba(150,220,255,.4)',core:ORB_B,lit:ORB_L,
                hi:'#fff',hiR:.54,ring:'rgba(70,165,235,.55)'};
/* The hot one is not just the cool one recoloured.
   - NO outer wash at all: both g1 (1.55r) and g2 (1.24r) are null. A warm
     translucent layer over this blue sky does not read as light coming off the
     ball - it desaturates to a muddy purple-grey and reads as a dirty ring
     around it. The cool orb gets away with it because it is washing blue over
     sand. The ball ends at its own edge here, which is also what lets it read as
     solid against a sky this busy. The null checks in drawSphere are for this.
   - its highlight is less than half the cool one's, because at the radius this
     ball spends most of its life a .54 white centre swallowed the red and it
     came out as a white dot with a red rim. */
const ORB_HOT ={g1:null, g2:null, core:'#e5240b',lit:KI,
                hi:'#ffd9a0',hiR:.30,ring:'rgba(170,30,5,.6)',
  /* ...and its sparks are the five-point star, in the menu's own red, rather
     than the four-point twinkle. No outline: they ride at 1.14r, outside the
     ball, so they are always on sky and the red carries itself. They spin, and
     sparkVar pulls their pulse in from the twinkle's .20-1.00 of base size to
     .70-1.00 - a five-fold swing is right for something meant to twinkle and far
     too much for a shape you are meant to read as a star. A touch larger than the twinkle it replaces, because
     the twinkle's long thin spikes read bigger than the solid shape. */
  sparkVar:.15,
  spark:(x,y,s,rot)=>star5(x,y,s*1.3,rot,'#e4002b')};
/* The energy feeding the ball: a wide soft glow with a bright hairline drawn
   down the middle of it. Named and paired because both trips up use the same
   one now, and because swapping a shot's FEED_HOT for FEED_COOL - alongside
   its `pal` - is the whole of putting that shot back to blue. */
const FEED_COOL={glow:'rgba(110,195,255,.55)', core:'rgba(255,255,255,.9)'};
const FEED_HOT ={glow:'rgba(255,120,36,.55)',  core:'rgba(255,236,198,.92)'};
function drawSphere(cx,cy,r,t,alpha=1,P=ORB_COOL){
  if(r<1)return;
  ctx.save();ctx.globalAlpha=alpha;
  if(P.g1){ctx.fillStyle=P.g1;circ(cx,cy,r*1.55);ctx.fill();}
  if(P.g2){ctx.fillStyle=P.g2;circ(cx,cy,r*1.24);ctx.fill();}
  ctx.fillStyle=P.core;circ(cx,cy,r);ctx.fill();
  ctx.fillStyle=P.lit;circ(cx-r*.06,cy-r*.07,r*.8);ctx.fill();
  ctx.fillStyle=P.hi;circ(cx-r*.13,cy-r*.15,r*P.hiR);ctx.fill();
  ctx.strokeStyle=P.ring;ctx.lineWidth=Math.max(1.2,r*.032);ctx.lineCap='round';
  for(let i=0;i<4;i++){const rr=r*(.62+.1*i),s=t*(.8+i*.3)*(i%2?-1:1);ctx.beginPath();ctx.arc(cx,cy,rr,s,s+1.1);ctx.stroke();}
  const spark=P.spark||((x,y,sz)=>sparkle(x,y,sz)), sv=P.sparkVar??.4;
  if(r>6)for(let i=0;i<6;i++){
    const a=t*.7+i*TAU/6, s=r*.09*((1-sv)+sv*Math.sin(t*6+i*2));
    spark(cx+Math.cos(a)*r*1.14,cy+Math.sin(a)*r*1.14,Math.max(2,s),t*1.7+i*1.1);
  }
  ctx.restore();
}

/* ---------- scenes ---------- */
/* The planet gathering the energy - the whole globe from space, the threads
   converging into one point. The corridor goes up to it twice and runs it on
   its own clock, which is what `pt` is for; called bare it reads the phase
   clock, as it did when the fight's fullShot phase owned it.
   `o` is the same shot dressed differently, for the SECOND trip up: every
   number the first one uses lives in OPEN_1 and is what the parameter defaults
   to, so the two callers share one body. Adding a field means adding it to
   OPEN_1 with the value this function used to have written in - that is the
   whole contract. */
/* Red since 2026-10-19, by request - "the genki dama is blue, can you switch
   the colors to red, just like the second planetary animation". Only the three
   colour fields moved: `dur`, `r0`, `r1` and the 90-thread default are the
   first trip's own and are untouched, so this is the same shot at the same
   size and the same pace, lit the way the second one is. */
const OPEN_1={dur:3.6, r0:0, r1:.045, threads:null, pal:ORB_HOT, ...FEED_HOT};
function opening(pt,o){
  const O=o||OPEN_1;
  const p=clamp((pt??G.pt)/O.dur,0,1);
  spaceBG();drawStars(1,-p*20,0);
  const R=Math.min(W*(PORT?.46:.4),H*.4),cx=W/2,cy=H*.54;
  const T=planetTarget(cx,cy,R,-1.25);
  ctx.save();const k=1+.07*ease(p);ctx.translate(T.x,T.y);ctx.scale(k,k);ctx.translate(-T.x,-T.y);
  drawPlanet(cx,cy,R);
  for(const th of (O.threads||THREADS)){
    const q=clamp((p*1.5-th.d)/.6,0,1);if(q<=0)continue;
    const sx=cx+Math.cos(th.a)*th.r*R, sy=cy+Math.sin(th.a)*th.r*R;
    const mx=(sx+T.x)/2,my=(sy+T.y)/2;const nx=mx-cx,ny=my-cy,nl=Math.hypot(nx,ny)||1;
    const px=mx+nx/nl*R*.35,py=my+ny/nl*R*.35;
    ctx.beginPath();let hx=sx,hy=sy;
    for(let i=0;i<=18;i++){const s=i/18*q,a=(1-s)*(1-s),b=2*(1-s)*s,c=s*s;hx=a*sx+b*px+c*T.x;hy=a*sy+b*py+c*T.y;i?ctx.lineTo(hx,hy):ctx.moveTo(hx,hy);}
    ctx.lineCap='round';ctx.strokeStyle=O.glow;ctx.lineWidth=3;ctx.stroke();ctx.strokeStyle=O.core;ctx.lineWidth=1.1;ctx.stroke();
  }
  /* The ball grows from r0 to r1 on the same squared curve it always did. Phase
     1 starts it at nothing; the corridor's second trip starts it at the size
     the first trip ENDED on, so the thing that comes back up is the one that
     went down - it does not get re-lit from a spark. */
  drawSphere(T.x,T.y,3+(O.r0+(O.r1-O.r0)*p*p)*Math.min(W,H),G.t,1,O.pal||ORB_COOL);
  ctx.restore();
}

/* Menu -> game: the menu swipes apart, then the camera climbs the backdrop to
   the sky, and only then does the run start. One clock per stage, and `state`
   doubles as the already-going guard so a second press cannot restart it --
   the same shape title.js uses in batidao de coco. */
const REDUCED=matchMedia('(prefers-reduced-motion:reduce)').matches;
/* The takeoff is two beats: he drops into a crouch the instant COMECAR is hit,
   and lifts straight out of it a glimpse later - the climb starts the frame the
   crouch ends, so there is no moment where he is simply off the ground. The
   menu keeps swiping away underneath on its own CSS clock, so this stage only
   has to cover the crouch. */
const CROUCH_MS=REDUCED?25:150;
const MENU_OUT_MS=CROUCH_MS, SKY_PAN_MS=REDUCED?120:1625;   // pan 30% slower than the first pass
// one source of truth for the climb: the sprite's CSS flight reads this too
document.documentElement.style.setProperty('--panMs',SKY_PAN_MS+'ms');
let INTRO={state:'idle',t:0};
function beginStart(){
  if(INTRO.state!=='idle'||G.phase!=='menu')return;
  audioInit();
  /* Every run starts at the top of the track. corridorHits() syncs the three
     punches by reading where the song actually is, and it only finds the beat
     when the song is roughly where a fresh load leaves it - so a REPLAY has to
     rewind or the second run would fall back to the fixed tempo and lose the
     phase. It fixes a first-run case too: audioInit() also fires on the secret
     and on a tap, so the song could already be a minute into its loop by the
     time COMECAR is pressed. */
  if(MUSIC){try{MUSIC.currentTime=0;}catch(e){}}
  tone('square',520,780,.09,.07);
  INTRO.state='out';INTRO.t=0;$('menu').classList.add('leaving');$('puff').classList.remove('go');
  setTitleSprite('crouch');   // braced, still on the sand
}
/* Where the dust appears is CSS's problem (#puff sits at the bottom of the same
   box the sprite stands in), so this only has to start it. Removing and
   re-adding the class with a reflow between restarts the animation. */
function kickDust(){
  if(REDUCED)return;
  const p=$('puff');p.classList.remove('go');void p.offsetWidth;p.classList.add('go');
}
function introTick(dt){
  if(INTRO.state==='idle')return;
  INTRO.t+=dt*1000;
  if(INTRO.state==='out'){
    if(INTRO.t>=MENU_OUT_MS){INTRO.state='pan';INTRO.t=0;
      // the menu stays in the DOM so he can keep flying over the climbing sky;
      // everything else is already parked off screen by the swipe
      kickDust();
      $('menu').classList.add('flying');setTitleSprite('fly');tone('sine',200,560,1.3,.1);}
  }else if(INTRO.t>=SKY_PAN_MS){
    INTRO.state='idle';INTRO.t=0;$('menu').hidden=true;
    $('menu').classList.remove('leaving','flying');toCorridor();
  }
}
function introPan(){return INTRO.state==='pan'?ease(clamp(INTRO.t/SKY_PAN_MS,0,1)):0;}
function titleScene(){
  // Title screen: backdrop only. It used to borrow gatherScene, which brought the
  // hero, the enemy, the energy orb and its ground light pool with it. A new, much
  // smaller character sprite goes here instead.
  if(!drawFundoTitle(introPan()))drawBG(BG1,H*.76,1.1);
}

/* ---------- scene 2: the cloud corridor ----------
   Sits between the takeoff and the fight. The menu pan ends with the camera at
   the top of fundo-1 and still climbing, so this picks that climb up on a fresh
   backdrop and carries it to a stop. It runs slower than the pan on purpose:
   the takeoff is the burst, this is the long coast at the top of it. */
const CORR=new Image();CORR.src='assets/Anime Sky Cloud Corridor.webp';
// decode it while the menu is up, so the cut into the climb does not hitch on a
// first-draw of a 1111x1416 png (same reason the floor is warmed up there)
CORR.addEventListener('load',()=>{CORR.decode&&CORR.decode().catch(()=>{});});
/* Screens of vertical climb. A landscape window cover-fits that image to its
   width and already has more slack than this asks for; a phone cover-fits to
   height and would have none at all, so in portrait the climb is what sets the
   scale, and the frame shows the middle ~40% of the image - the corridor itself. */
const CORR_CLIMB=()=>PORT?.55:1;
/* The kick swings past its resting size and settles back THROUGH it, so for part
   of a second the frame is smaller than the screen. The canvas is never cleared -
   every scene here paints full bleed - so a frame that does not reach an edge
   leaves the previous one showing in the strip. Both margins below are sized off
   that undershoot: CORR_OVER widens the art, CORR_TOP keeps sky above the locked
   frame (pan 1 pins the image's top edge to y=0, and the kick scales about the
   centre, which pulls that edge down). */
const CORR_KICK=.05;                 // the punch, as a fraction of frame size
const CORR_DIP=CORR_KICK/3;          // how far under 1 the envelope bottoms out
const CORR_OVER=1+CORR_DIP*2, CORR_TOP=()=>H*CORR_DIP;
/* One damped swing: full at the start, through zero a third of the way in, one
   shallow undershoot, home. The frame kick and the urna's entrance both ride it,
   so the two land and settle as a single hit rather than two events. */
const kickEnv=q=>(1-q)*Math.cos(q*Math.PI*1.5);
// the urna's climb into frame: fast out of the bottom edge, decelerating into
// place, so it is at rest on the frame the first stab lands on
const easeOut=p=>1-Math.pow(1-p,3);
/* The urna takes the stab on the frame the lock does. It is drawn OUTSIDE the
   camera kick, on its own anchor: what it was asked for is the bottom edge,
   centred, almost touching - and a camera scaling about the screen centre would
   shove it past that edge and drag it back. So it gets a swing of its own.
   Kept small on purpose. It used to be .22, from when the machine appeared out
   of nothing on this beat and the kick had to carry the arrival; it rides in
   before the stabs now, so the kick only has to register as a hit on something
   already standing there. Twice the camera's own .05 is enough for that. */
const CORR_URNA_KICK=.10;
// ...and half again on the two stabs after it, which are accents on a machine
// that has been in place for a beat already.
const CORR_URNA_ACCENT=.05;
/* Planted on the bottom edge, not hovering over it. Two parts, both measured in
   the machine's own drawn height so they hold at every screen size:
   URNA_FILM is the empty strip the art carries under the machine (rows 1007-1023
   of 1024 are transparent), which is what made a rect flush with the edge still
   leave it floating; CORR_URNA_SINK is the little bit more that tucks its feet
   under the edge, so it reads as resting on the frame rather than above it.
   The kick scales about this same point, so the machine's base stays below the
   edge through the whole swing - at no size and no moment does it lift off. */
const URNA_FILM=.0166, CORR_URNA_SINK=.03;
const CORR_RISE=REDUCED?.12:2.2;    // s of climb, when there is no song to climb against
const CORR_PUNCH=REDUCED?.05:.42;   // s for a kick to settle
/* ---- the scene punches on the beat ----
   sequencia-13.mp3 opens quiet and then lands four identical stabs, evenly
   spaced, before the groove comes in at ~5.7s. These are the last three of them,
   in seconds from the top of the song: taking the last three rather than the
   first means the run of stabs and the run of punches finish on the same hit
   instead of leaving one hanging over the cut. Measured off the file by onset
   strength, so if the track is ever replaced these are what have to change. */
const CORR_BEATS=[4.191,4.644,5.108];
const CORR_BEAT_GAP=(CORR_BEATS[2]-CORR_BEATS[0])/2;   // the song's own spacing, ~131bpm
/* The urna rides in with the camera rather than appearing on the first stab: it
   starts wholly below the frame and climbs into place over the last two beats of
   the climb, arriving exactly as that stab lands. Two beats rather than a count
   of seconds, so it keeps the song's own pulse however long the climb turns out
   to be - and the scene caps it against the climb, so a short one (reduced
   motion, or the fallback clock) cannot ask it to start before the scene does. */
const CORR_URNA_RISE=CORR_BEAT_GAP*2;
/* Scene-relative times for the three punches, i.e. seconds into this phase.
   audioInit() runs on the very press that starts the intro, so the song should
   be ~1.8s in by the time we get here and the first stab still ahead - but
   play() is async and a slow start would drag every punch off the beat, so read
   where the song ACTUALLY is and let that set the length of the climb. The
   fallback keeps the song's tempo even when it cannot keep its phase: music
   blocked, file missing, or the page opened over file:// where the media element
   cannot be routed through WebAudio at all. */
function corridorHits(){
  const st=(MUSIC&&!MUSIC.paused&&MUSIC.currentTime>0)?MUSIC.currentTime:-1;
  const lead=CORR_BEATS[0]-st;
  if(st>0&&lead>=CORR_RISE*.55&&lead<=CORR_RISE*1.9)return CORR_BEATS.map(b=>lead+b-CORR_BEATS[0]);

   nothing at all. Pale grey carries against both, and the few places it crosses
