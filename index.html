/* ...and off centre, to the left. Like the drop above this is kept as a fraction
   rather than a literal offset: 150px measured on a 1280-wide window. A fixed
   150px would be 12% of a desktop but 38% of a phone, which would throw him
   most of the way off the side of a screen he is already wider than. */
const CORR_MAN_X=-150/1280;
/* The ball he charges. Both offsets are fractions of HIS drawn box, not the
   screen, so it stays on his hands at any size: his hat brim tops out 13% down
   his height and his two raised hands frame the empty space just above it, which
   is where this sits - clear of the brim rather than resting on it, so it reads
   as gathering at a distance above him. There is not much more room than this:
   his own top is only a little way inside the frame, so pushing the ball higher
   than ~.04 starts taking the glow off the top edge at full charge, and the max
   radius would have to come down with it. His hat centre is a touch right of his
   box centre (51.8% of his width), hence the nudge. */
const CORR_BALL_Y=.045, CORR_BALL_X=.018;
/* It also climbs as it fills - about 100px of lift by the time it is full, at
   the size he is drawn on a 720-tall window. Kept in HIS height like every other
   number here, so it scales with him instead of drifting off his hands on a
   taller screen. Linear in the charge: no lift when empty, all of it at full. */
const CORR_BALL_LIFT=.13;
/* The sky going red as the ball tops out. CORR_RED_FROM is the share of the
   charge where it starts to come in - below that there is none - and it ramps
   linearly from there to full, so it arrives as you top out rather than snapping
   on, and leaves again the moment the ball starts shrinking. It is laid over the
   BACKDROP ONLY: see where it is drawn, before the ball, the man and the machine,
   none of which are tinted.
   The red is bright on purpose. The backdrop is a strong blue, and a dark or
   half-transparent red over it lands in muddy purple; it takes a hot red at this
   much alpha to actually read as a red sky rather than a bruise. */
const CORR_RED_FROM=.85, CORR_RED_MAX=.62;
/* ...and it keeps going into the overcharge: CORR_RED_MAX is where the sky is
   when the ball is at its old full, CORR_RED_OVER where it is at the new size.
   Same hot red, more of it - the one thing that cannot be done here is to reach
   for a darker red, which over this blue goes straight to bruise purple. */
const CORR_RED_OVER=.85;
/* Radius, empty -> full, also as a fraction of his height. The full size is
   deliberately larger than the room above him: at .214 of his height the top of
   the ball, and more of its glow, run off the top of the frame. That is the
   look - a genki dama outgrowing the shot - not an oversight. If it should be
   contained again, CORR_BALL_Y has to come down with it, and at that point it
   starts eating his head instead. */
const CORR_BALL_R0=.012, CORR_BALL_R1=.322;
/* ---- past full ----
   Once the planet has answered, the ball can be pushed 30% BIGGER than it could
   ever get before (20% first, raised 2026-10-16 - it read as too small a reward
   for the trip). The request was about the ball, so that is what the constant
   says, and the charge cap is derived from it rather than guessed: the radius is
   R0 + R1*e, so the charge that makes it 1.3x its old full value is this. It
   works out to ~1.31, and nothing else in the scene has to know that number.
   Until the planet answers the cap is a flat 1, which is what makes the first
   visit to this screen unable to reach the new size. */
const CORR_BALL_OVER=.30;
const CORR_E_MAX=()=>1+((CORR_BALL_R0+CORR_BALL_R1)*CORR_BALL_OVER)/CORR_BALL_R1;
const corrCap=()=>G.corrPlus?CORR_E_MAX():1;
/* Where in that new range he starts shouting, as a share of the cap. At .97 the
   swap reads as "the ball has reached the new size"; set it to 1/CORR_E_MAX()
   and he would change the moment it passes its old full instead. */
const CORR_SHOUT_AT=.97;
/* per press. ~58 presses to fill; the fight's own mash is 1.75 of 100. Halved on
   2026-10-16 - at .035 the ball was full before the player felt they had worked
   for it. CORR_DECAY rides on this number rather than standing beside it, so the
   bleed halves with it and the press RATE needed to hold the ball at the top is
   unchanged: this knob buys length, not difficulty. */
const CORR_MASH_GAIN=.0175;
/* ...and it bleeds back down when you stop, the way the fight's does. Not the
   fight's number, its RATIO: there you gain 1.75 a press and lose .9 a second,
   so a second of idling costs you about half a press. This is that same half
   press per second at this screen's own gain, which is why it is written as a
   multiple of it rather than as a figure of its own. */
const CORR_DECAY=CORR_MASH_GAIN*.514;
/* He locks on the first stab and takes it like everything else does, through the
   same damped swing - small, because he is the biggest thing on screen and a
   kick that reads as slight on the urna is a lot of pixels on him. Only the
   first: the two stabs after it are the urna's and the camera's, and he is
   hovering by then. */
const CORR_MAN_STAB=.045;
/* ...and once he is locked, he hovers. Amplitude as a fraction of the screen so
   it reads the same at any size, and it eases in FROM ZERO after the lock, so
   the bob cannot step him the instant it starts however the sine happens to be
   phased when he gets there.
   The rate is set by how long he is actually on screen, which is the lock to the
   end of the scene - about 1.9s. A slow, pretty 5s float spends that drifting
   one way and never reads as a hover at all; at ~2.1s he gets a full rise and
   fall inside the window, and the ease-in is kept short so most of it runs at
   full amplitude. */
const CORR_MAN_HOVER=.018, CORR_MAN_HOVER_W=3.0, CORR_MAN_HOVER_IN=.35;
/* He rides the same window the urna does and stops higher, so over one window he
   travels further - he reads as overtaking it, which is what being behind it and
   still climbing should look like. */
function corridorMan(rise,kick,q,bob){
  if(!CORR_MAN.complete||!CORR_MAN.naturalWidth)return;
  /* He is tall and narrow, so height leads and the cap is the guard rail: left
     at a fixed fraction of the width it would quietly refuse a resize on a phone,
     where height is the plentiful axis, and he would come out short of what was
     asked for without anything looking wrong.
     The height is measured off the LEVITATING pose whichever one is drawn. The
     shouting pose is half again as wide for the same figure, so letting the cap
     see it would shrink him by a third on a phone - the art would swap and he
     would appear to shrink back, which is the one thing the swap must not do.
     The arms run off the sides there instead, as his head already does. */
  const e=G.corrE||0;
  // an Image is always truthy, so "loaded" has to be a pixel test, not a null check
  const img=(G.corrPlus&&CORR_SHOUT.naturalWidth&&e>=CORR_E_MAX()*CORR_SHOUT_AT)?CORR_SHOUT:CORR_MAN;
  const h=Math.min(H*CORR_MAN_H,W*CORR_MAN_W*CORR_MAN.height/CORR_MAN.width),
        w=h*img.width/img.height;
  // rise 0 parks him wholly under the frame, rise 1 is his resting centre; the
  // stab scales about that same centre, so the lock does not shift him
  const s=1+kick*kickEnv(q);
  ctx.save();ctx.translate(W/2+W*CORR_MAN_X,lerp(H+h/2,H*CORR_MAN_MID,rise)+bob);ctx.scale(s,s);
  /* The ball goes down BEFORE him, so he occludes it - it is gathering behind
     his head, not held out in front of his face. Still inside his transform, so
     it rides the rise, the hover and the lock stab with him and needs no second
     copy of any of that. Nothing is drawn at zero, so it begins at the first
     press rather than sitting there as a dot waiting to be fed. */
  if(e>0)drawSphere(w*CORR_BALL_X,-h/2+h*(CORR_BALL_Y-CORR_BALL_LIFT*e),h*(CORR_BALL_R0+CORR_BALL_R1*e),G.t,1,ORB_HOT);
  ctx.drawImage(img,-w/2,-h/2,w,h);
  ctx.restore();
}
/* URNA[0] is the idle frame - the mash animation is the fight's, not this
   scene's. Anchored bottom-centre so the swing breathes around that edge
   instead of sliding the machine along it. */
function corridorUrna(kick,q,rise){
  // the frame the fight would show for this same press - see urnaFrame()
  const f=urnaFrame(), im=URNA[f];
  if(!im.complete||!im.naturalWidth)return;
  // wide art (1536x1024); a phone gives it nearly the full width, a desktop a
  // share of it, and both are capped against the height so it stays an object
  // sitting at the bottom of the sky rather than a wall across it
  const b=urnaBox(), w=b.w, h=b.h;
  const s=1+kick*kickEnv(q);
  /* rise 0 parks the whole rect one full height below the frame - further than
     it needs, since the art's own top 6% is transparent, but it costs nothing
     and leaves no chance of a sliver showing before it sets off. rise 1 is the
     planted anchor, and the kick scales about whatever point that works out to,
     so the machine's base stays put through the swing at either end. */
  ctx.save();ctx.translate(W/2,lerp(H+h,b.base,rise));ctx.scale(s,s);
  // the press also sinks it 2px, as it does in the fight - scaled, since the
  // machine is drawn a good deal bigger here than it is on the phone dock
  ctx.drawImage(im,-w/2,-h+(f?h*.0087:0),w,h);
  ctx.restore();
}
/* The corridor itself, drawn at the origin. The compositor below is what slides
   it, so nothing in here knows or cares where on the strip it ends up. */
function corridorWorld(t){
  const hits=G.corrHits;
  // the climb ends on the first stab; after that the camera is locked and only
  // the kicks move it
  const pan=ease(clamp(t/hits[0],0,1));
  /* Which punch we are inside, and how far through its swing. Walking the list
     rather than tracking an index means a dropped frame cannot leave the scene
     stuck mid-kick: the swing is always read off the clock. */
  let n=-1,q=0;
  for(let i=0;i<hits.length;i++)if(t>=hits[i]){n=i;q=clamp((t-hits[i])/CORR_PUNCH,0,1);}
  /* The kick: the frame overshoots its resting size by a hair and settles back
     through one damped swing. It has to read as a hit, not a bounce, so there is
     exactly one crossing and no second rise. */
  const k=1+CORR_KICK*(n<0?0:kickEnv(q));
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.translate(-W/2,-H/2);
  drawCorridor(pan);
  ctx.restore();
  // ...and the red over it, while it is still the only thing on the canvas
  const ce=G.corrE||0;
  const red=clamp((ce-CORR_RED_FROM)/(1-CORR_RED_FROM),0,1);
  const over=clamp((ce-1)/(CORR_E_MAX()-1),0,1);
  const sky=red*CORR_RED_MAX+over*(CORR_RED_OVER-CORR_RED_MAX);
  if(sky>0){ctx.fillStyle='rgba(255,40,18,'+sky.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
  /* The urna's own climb, ending on the first stab. Capped against hits[0] so it
     can never be asked to begin before t=0. Before that first stab there is no
     kick to ride, so it is passed 0 rather than a q the swing would read as the
     top of a kick. */
  const rd=Math.min(CORR_URNA_RISE,hits[0]);
  const rise=easeOut(clamp((t-(hits[0]-rd))/rd,0,1));
  /* Him, and him only. The machine used to be drawn here, on top of him - it is
     the compositor's now (see corrUrnaNow), because it no longer travels with
     this screen. He still comes up BEHIND it, since it is drawn after all of
     this rather than before. */
  if(rise>0){
    const hov=clamp((t-hits[0])/CORR_MAN_HOVER_IN,0,1);
    corridorMan(rise,n===0?CORR_MAN_STAB:0,q,Math.sin(G.t*CORR_MAN_HOVER_W)*H*CORR_MAN_HOVER*hov);
  }
  corridorLogo(t);   // over everything, including him
  corridorCta(t);    // ...and the bands over everything too
  corridorBack(t);
}
/* The machine is a fixture of this phase now, not part of its scenery: the
   screen slides to the antagonist and fades to the globe, and it stays exactly
   where it is through both, lit the whole time. So it is drawn by the
   compositor, last and untransformed, instead of inside corridorWorld - which
   is also what keeps it off the strip and out from under the veil. Its own
   entrance and its own kicks are unchanged; it is only the camera it has
   stopped listening to. The stab it is on has to be worked out again here,
   because corridorWorld keeps that to itself. */
function corrUrnaNow(t){
  const hits=G.corrHits;
  let n=-1,q=0;
  for(let i=0;i<hits.length;i++)if(t>=hits[i]){n=i;q=clamp((t-hits[i])/CORR_PUNCH,0,1);}
  const rd=Math.min(CORR_URNA_RISE,hits[0]);
  const rise=easeOut(clamp((t-(hits[0]-rd))/rd,0,1));
  if(rise>0)corridorUrna(n<0?0:(n?CORR_URNA_ACCENT:CORR_URNA_KICK),q,rise);
  drawSmoke();   // out of the lid, so over the machine rather than behind it
}
/* Each half of a strip is clipped to its OWN frame, and this is not a tidy-up.
   A panel does not paint W wide: drawAntagonist height-fits a 1.99:1 picture, so
   it comes out 1434px across a 1280 screen and 1329 across a 375 phone, centred
   - which means it paints 77px, or 477px, past each side of the panel it
   belongs to, straight over the half that is still showing the other screen.
   The user saw it as the antagonist "bleeding into the left" on the way home,
   and worse on a phone, where the overdraw is wider than the whole screen and
   he covers the corridor until the slide is nearly finished. drawPlate and
   drawCorridor overdraw the same way for the same reason.
   The rect runs a pixel outside the frame on every side so the two halves
   OVERLAP by a pixel at the seam rather than risk a hairline of stale canvas
   between them - the canvas is never cleared, so a gap shows something old. */
function panelClip(){ctx.beginPath();ctx.rect(-1,-1,W+2,H+2);ctx.clip();}
/* The compositor. Nothing happens here at all until the trip starts, so the
   scene draws exactly as it did before this existed. During the trip the two
   screens ride the strip together and the lock pop scales the pair of them. */
function corridorScene(){
  const t=G.pt, {p,lock}=antaSlide(t), fade=globeFade(), roar=roarSlide();
  /* The second lateral trip, built on the first one's strip. It can only start
     long after the antagonist is home and the planet has answered, so no two of
     these three branches can ever want the same frame. What is different is
     where it lets go: the screen it travels back to is a new one, and it stays
     there. */
  if(roar){
    const rq=roar.lock>=0?clamp(roar.lock/CORR_PUNCH,0,1):1;
    const rk=1+CORR_ANTA_KICK*lockEnv(rq);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(rk,rk);ctx.translate(-W/2,-H/2);
    if(roar.p<1){ctx.save();ctx.translate(-roar.p*W,0);panelClip();
      if(roar.home)rageWorld();else corridorWorld(t);ctx.restore();}
    if(roar.p>0){ctx.save();ctx.translate((1-roar.p)*W,0);panelClip();
      ragePlate(LOSER,CORR_LOSER_TOP,.5,CORR_LOSER_SHAKE,CORR_LOSER_SAT);ctx.restore();}
    ctx.restore();
    corrUrnaNow(t);return;
  }
  /* The finish, in reverse order of when it happens - the latest stage wins the
     frame. The machine is on the glass in every one of them, lit, pressable and
     smoking: it is the only thing that has been on screen since the beginning
     and it does not leave for any of this. */
  /* The end of the game. Three stages on one clock: the world going white with
     the machine still on it, white alone, and the sky coming up out of the
     white while the camera starts down the picture. The urna is drawn in the
     first stage only - it goes bright with everything else and does not come
     back. Nothing here shakes and nothing here is red. */
  if(corrOver()){
    const a=G.corrOver, TOP=CORR_BLOW_TOP();
    if(a<TOP){
      const i=G.corrCut, c=CUTS[i];
      drawPlate(c.img,c.top,c.shake*H,G.t,c.ax);
      rageTint({x:0,y:0,w:W,h:H},c.sat);
      if(a<CORR_BLOW_IN)corrUrnaNow(t);      // its last frame, about to be burnt out
      const u=a<CORR_BLOW_IN?a/CORR_BLOW_IN:1;
      ctx.fillStyle='rgba(255,253,248,'+(u*u).toFixed(3)+')';ctx.fillRect(0,0,W,H);
      return;
    }
    rallyWorld(a-TOP);
    const v=1-clamp((a-TOP)/CORR_BLOW_OUT,0,1);
    if(v>0){ctx.fillStyle='rgba(255,253,248,'+v.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
    return;
  }
  if(G.corrCut>=0){
    const i=G.corrCut, c=CUTS[i], a=G.corrEnd, S=CORR_END_SLIDE;
    /* A keyframe arriving where it stands. Nothing travels: the frame before it
       is painted, the new one is faded over it, and the PAIR is tinted once -
       tinting each and fading between the results would run the colour blend
       part-way and turn the screen purple. Then the flash, which is the blast
       pulsing again, and a kick on the whole frame so the change lands as a
       hit. Both are drawn through the same shakeOff, so the two keyframes
       rumble together the way two frames of one shot have to. */
    /* Up to the planet and back down, with the machine on the glass the whole
       way as it is on every other screen. Before the shot the black is over the
       plate we are leaving; after it, over the one we are arriving at - so the
       change of screen happens inside the dark, which is what the fade is for. */
    if(c.in==='orbit'){
      if(a<CORR_ORBIT_TRIP()){
        const f=orbitFade(a);
        if(f.shot>=0)orbitScene(f.shot,ORBIT_2);
        else cutPlate(a<CORR_GLOBE_FADE?CUTS[i-1]:c);
        if(f.veil>0){ctx.fillStyle='rgba(0,0,0,'+f.veil.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
      }else cutPlate(c);
      cutOver(t);return;
    }
    if(c.in==='cut'){
      const prev=CUTS[i-1], amp=c.shake*H;
      const m=clamp(a/CORR_DISINT_MIX,0,1);
      const k=1+CORR_DISINT_KICK*lockEnv(clamp(a/CORR_PUNCH,0,1));
      ctx.save();ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.translate(-W/2,-H/2);
      let r;
      if(m<1)r=drawPlate(prev.img,prev.top,amp,G.t,prev.ax);
      if(m>0){ctx.globalAlpha=m;r=drawPlate(c.img,c.top,amp,G.t,c.ax);ctx.globalAlpha=1;}
      rageTint(r,c.sat);
      const f=1-clamp(a/CORR_DISINT_FLASH,0,1);
      if(f>0){ctx.fillStyle='rgba(255,246,232,'+(f*CORR_DISINT_FLASH_A).toFixed(3)+')';
              ctx.fillRect(r.x,r.y,r.w,r.h);}
      ctx.restore();
      cutOver(t);return;
    }
    const p=a<S?easeOut(a/S):1, lock=a<S?-1:a-S;
    const eq=lock>=0?clamp(lock/CORR_PUNCH,0,1):1;
    const ek=1+CORR_ANTA_KICK*lockEnv(eq);
    ctx.save();ctx.translate(W/2,H/2);ctx.scale(ek,ek);ctx.translate(-W/2,-H/2);
    /* Whatever we are leaving: the plate before this one in the chain, or the
       roaring screen if this is the first step off it. */
    if(p<1){ctx.save();ctx.translate(-c.dir*p*W,0);panelClip();
      if(i)cutPlate(CUTS[i-1]);else rage2World();ctx.restore();}
    ctx.save();ctx.translate(c.dir*(1-p)*W,0);
    if(p<1)panelClip();            // once home it is the whole frame, and clips nothing
    cutPlate(c);ctx.restore();
    ctx.restore();
    cutOver(t);return;
  }
  if(G.corrRage2>=0){rage2World();corrUrnaNow(t);return;}
  /* Up for the last time. The machine stays on the glass through the fade and
     through the shot, lit and pressable, exactly as it did on the first trip. */
  const up=globe2Fade();
  if(up){
    if(up.shot>=0)opening(up.shot,OPEN_2);else if(up.home)rage2World();else rageWorld();
    if(up.veil>0){ctx.fillStyle='rgba(0,0,0,'+up.veil.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
    corrUrnaNow(t);return;
  }
  if(corrRage()){rageWorld();corrUrnaNow(t);return;}
  /* The trip to the full shot owns the screen while it runs. It cannot start
     before the scripted run is over, so the lateral slide is always home by the
     time this branch can be taken and the two never share a frame. Whichever
     screen is up is drawn whole, in its own right, with the black laid over it
     last - so the veil covers every layer either of them paints, the uncleared
     canvas included. */
  if(fade){
    if(fade.shot>=0)opening(fade.shot);else corridorWorld(t);
    if(fade.veil>0){ctx.fillStyle='rgba(0,0,0,'+fade.veil.toFixed(3)+')';ctx.fillRect(0,0,W,H);}
    corrUrnaNow(t);return;   // over the black: the machine does not go dark
  }
  if(p<=0&&lock<0){corridorWorld(t);corrUrnaNow(t);return;}
  const q=lock>=0?clamp(lock/CORR_PUNCH,0,1):1;
  const k=1+CORR_ANTA_KICK*lockEnv(q);
  ctx.save();ctx.translate(W/2,H/2);ctx.scale(k,k);ctx.translate(-W/2,-H/2);
  if(p<1){ctx.save();ctx.translate(-p*W,0);panelClip();corridorWorld(t);ctx.restore();}
  if(p>0){ctx.save();ctx.translate((1-p)*W,0);panelClip();drawAntagonist();ctx.restore();}
  ctx.restore();
  corrUrnaNow(t);   // outside the strip AND outside the lock pop: it holds still
}
/* ---------- the urna ----------
   The machine on the glass, and which frame of it is showing: driven straight
   off G.lastMash, 1 the button struck and flashing, 2 the residual sparks, 0
   idle. One clock, so the art cannot drift out of step with the press the game
   actually registered. The corridor draws it itself (corridorUrna / urnaBox) -
   this is only the frame choice. The fight's own corner-and-dock version of the
   machine, drawUrna, went with the fight, and --urnaH with it: it existed to
   keep the on-screen Mash and Throw buttons clear of the dock. */
const URNA=[1,2,3].map(n=>{const i=new Image();i.src=encodeURI('assets/new/urna-'+n+'.webp');return i;});
const URNA_FLASH=.07, URNA_AFTER=.13;   // seconds on frame 2, then on frame 3
function urnaFrame(){
  const since=G.t-(G.lastMash??-9);
  return since<URNA_FLASH?1:since<URNA_FLASH+URNA_AFTER?2:0;
}

/* ---------- the orbit shot ----------
   The ball coming down on the planet. The corridor reaches it from the cut
   chain when CORR_ORBIT_CUT is on, and runs it the way it runs opening(): its
   own clock through `pt`, its own colours through `o`. Everything it changes is
   a colour - the ball that lands down there is the red one it has been feeding,
   so the flare, the rim light on the shockwave and the flash that opens the
   shot are all warm. The planet and the stars are untouched: it is the same
   shot, not a new one.
   ORBIT_1 is the dressing the fight used and is still the default. Its `miss`
   variant - the cold shot where the ball lands wide, which the fight cut to
   when the player missed - went with the fight, so the flare sizes and the
   flash below are the hit's, with nothing to pick between any more. */
const ORBIT_1={flare:[[2.2,'rgba(143,216,255,.45)'],[1.5,ORB_L],[1,'#fff']],
               rim:'#fff', flash:'255,255,255'};
const ORBIT_2={flare:[[2.2,'rgba(255,108,28,.45)'],[1.5,KI],[1,'#ffe2b4']],
               rim:'#ffd9a0', flash:'255,226,190'};
function orbitScene(pt,o){
  const O=o||ORBIT_1, t=pt??G.pt;
  spaceBG();drawStars(1);
  const R=Math.min(W*(PORT?.46:.4),H*.4),cx=W/2,cy=H*.54;
  const a=-1.25, T=planetTarget(cx,cy,R,a);
  drawPlanet(cx,cy,R);
  ctx.save();circ(cx,cy,R);ctx.clip();
  const fr=.18*R+t*R*.1;
  ctx.globalAlpha=clamp(1.3-t*.35,0,1);
  O.flare.forEach(([k,c])=>{ctx.fillStyle=c;circ(T.x,T.y,fr*k);ctx.fill();});
  ctx.beginPath();const ring=fr*1.8+t*R*.15;ctx.ellipse(T.x,T.y,ring,ring*.45,a+Math.PI/2,0,TAU);ctx.lineWidth=5;ctx.strokeStyle=INK;ctx.stroke();ctx.lineWidth=2.5;ctx.strokeStyle=O.rim;ctx.stroke();
  ctx.restore();ctx.globalAlpha=1;
